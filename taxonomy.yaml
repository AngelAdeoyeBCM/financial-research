version: "1.0"

# Category -> subcategories. Labels are only ever read from here.
categories:
  Central bank:
    - Meeting preview/review
    - Policy rate path
    - Minutes and guidance
    - FX intervention and reserves
    - Liquidity and balance sheet
    - Framework and independence
  Rates:
    - Local curve and duration
    - Swaps and OIS
    - Inflation-linked
    - Real yields and term premium
    - Auctions and supply
    - Foreign flows and index inclusion
    - Relative value
  FX:
    - Spot outlook and forecasts
    - Carry and vol
    - NDF and cross-currency basis
    - Flows and positioning
    - Regime (peg/managed float)
    - Options and skew
  Fiscal:
    - Budget and deficit
    - Debt sustainability
    - Financing and issuance plan
    - Subsidies and tax policy
    - Quasi-fiscal/SOEs
  Macro:
    - Growth and activity
    - Inflation
    - External balance
    - Labour market
    - Commodities and terms of trade
    - Global spillovers
  Risk:
    - Sovereign credit and ratings
    - Politics and elections
    - Geopolitics and sanctions
    - Capital controls/regulation
    - Contagion and stress
    - Scenarios and tail risks
  Unclassified:
    - Unclassified

# Category used when nothing fits (never force a fit).
fallback_category: Unclassified

document_types:
  - daily
  - weekly
  - strategy
  - trade idea
  - event preview
  - thematic

entity_types:
  - central_bank
  - institution
  - person
  - currency
  - instrument
  - event

review:
  confidence_threshold: 0.7
  min_body_chars: 200

