exclusions:
- text: Of course, the key question is where to from here?
  code: NON_CLAIM
  reason: Rhetorical framing, not a claim.
- text: A key question we have been receiving in recent days and weeks is whether a decline in energy prices would allow the Fed to do less.
  code: NON_CLAIM
  reason: Posed as a question; the answer is covered by S020.
- text: We agree with that premise.
  code: REDUNDANT
  reason: Restates the market-premise judgement already captured in S016.
- text: The first round will set the results for both houses of Congress and define the second rounds for the gubernatorial and presidential races.
  code: NOT_LOAD_BEARING
  reason: Procedural election detail; does not ground the Brazil view.
- text: The solid performance of UK assets materialised, despite the timing of the Labour Party conference and the accompanying policy announcements.
  code: NOT_LOAD_BEARING
  reason: Scene-setting; the market outcome is captured in S049.
- text: However, we have received fewer questions on the likely path for ECB policy rates over the last week than on its reaction function to the widening in EGB spreads.
  code: META
  reason: Commentary on client questions, not an argument.
- text: We will be watching closely the cacophony of ECB Governing Council members due to speak this week who will no doubt be asked about their level of openness to using the tool and/or other options – such as an earlier end to rate hikes or putting the brakes on QT.
  code: VAGUE
  reason: Forward-looking watch item with no measurable outcome.
- text: 'The NBP’s post-MPC press conference this coming week is likely to provide more colour on how the central bank is thinking about the medium -term risks to its estimates : see CEE rates: Sustained energy crisis set to trigger policy adjustments, dated 1 October.'
  code: VAGUE
  reason: Event-timing commentary with no substantive outcome.
