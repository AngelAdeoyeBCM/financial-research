- text: We favour long GBPUSD to position for reduced UK political uncertainty and wide rate differentials, while we prefer to hedge against further EUR weakness via short EURAUD and EURMXN.
  code: REDUNDANT
  reason: Key-views restatement of the GBPUSD and EUR hedge trades covered by S034 and S028.
- text: The most consequential announcement from Prime Minister Burnham’s inaugural speech was a “fully funded” national social care service (about GBP18bn/year). Funding will be partially secured through a reform of the UK’s pension triple lock from 2030, though additional tax hikes or spending cuts will likely be necessary to fully fund the service.
  code: TANGENTIAL
  reason: Policy detail not used in the GBP argument.
