evidence:
- id: E001
  text: The relatively soft 29k rise in nonfarm payrolls in September, when combined with PCE revisions that revealed a slightly softer underlying pace of core inflation, likely takes some pressure off the FOMC and supports our view that the Committee will opt to wait until December before removing some further accommodation.
- id: E002
  text: The headline NFP number belied a stronger underlying picture, when considering the whopping 406k rise in employment as measured by the household survey, increasing hours worked which points to increased labour utilization, and the fact that the rise in the unemployment rate from 4.1% to 4.2% was primarily driven by a rise in the participation rate.
- id: E003
  text: We therefore continue to expect another two hikes – at a minimum – from the FOMC, in order to remove last year’s ‘insurance’ cuts and take policy to a more neutral level in real terms.
- id: E004
  text: But we don’t view energy prices as the primary driver of pressure in the US. Instead, the issue is about the entrenchment of pandemic-era inflation into services, combined with persistently elevated aggregate demand in the economy.
- id: E005
  text: As such, lower energy prices would take some headline pressure off but would likely lead to a positive response in sentiment, a rise in investment and consumption that could necessitate an even tighter monetary policy stance
- id: E006
  text: While these developments have provided some relief to the back end of the US yield curve, we don’t think this is a reason to turn bullish on the long end of the yield curve. We think the market will need to see delivery of further rate hikes for the Fed to re-establish credibility in the eyes of investors while fiscal fundamentals have not changed, and we see scope for wider term premiums.
- id: E007
  text: A decline in energy prices would be a more welcome source of relief for the ECB, where price pressures are more externally driven than domestically entrenched.
- id: E008
  text: Combined with the tightening of financial conditions , reflected – among other things – in wider peripheral bond spreads, suggests a near -zero chance that the Governing Council will vote to accelerate the tightening cycle by hiking again in October, in line with our view. We continue to expect one more hike, in December, before an extended pause.
- id: E009
  text: Recent volatility adds weight to our view that the ECB will deliver fewer rate increases than the market has priced, with the Governing Council likely to prefer a ‘high for longer’ strategy instead.
- id: E010
  text: The 10y OAT -Bund spread briefly touched 150bp on Friday, its highest since 2012 during the height of the eurozone sovereign debt crisis.
- id: E011
  text: The latest leg of the move looks to be less a reflection of fundamentals – which have not suddenly deteriorated even though they remain weak – and more stop-out-driven selling.
- id: E012
  text: Our fundamental analysis suggests that 150bp on 10y OAT-Bund spreads would be a level consistent with the market pricing a country going towards BBB+, levels reached briefly on Friday.
- id: E013
  text: 'However, for a sustained rally in OAT spreads where fundamentals start to reassert themselves, we would need: i) positioning to be cleared out, especially front-end longs; ii) the budget in France to pass this year, with the social security vote in November an important test; iii) strong OAT auctions as an important source of price discovery and demand ; iv) greater details on the RN’s fiscal consolidation plan, expected in the coming week; v) a shift in the French opinion polls.'
- id: E014
  text: Meanwhile, we think that there is a high bar for the ECB to step in and use its ‘Transmission Protection Instrument’, which was unveiled in 2022 but remains untested.
- id: E015
  text: Last week, we added EUR downside protection against OAT-spread widening to our strategy portfolio via short EURAUD, in addition to our EURMXN ratio put spread.
- id: E016
  text: Our existing forecasts captured risk premium being embedded into the EUR ahead of the 2027 French election in Q1 as was the case in prior presidential election years. However, this premium is being embedded sooner and more quickly than we thought, implying more front-loaded weakness and representing downside risk to our 1.14 year-end target for EURUSD.
- id: E017
  text: While ultimately our base case is that French election risks are evenly balanced, with the election still a few months away and room for risk premium to continue to rise, we prefer to hedge the risk of further EUR weakness.
- id: E018
  text: We think the GBP is well placed to benefit in the coming weeks given reduced UK political uncertainty, ongoing M&A inflows, and wide rate differentials.
- id: E019
  text: 'We entered a long GBPUSD position to fade extended short positioning into a seasonally bullish period (FX: Long GBPUSD, dated 30 September).'
- id: E020
  text: Nevertheless, the announcements reinforced that th e government is pursuing a phased approach to major reforms, with many measures likely to be implemented in the next parliament, therefore having limited implications for the forthcoming budget (28 October).
- id: E021
  text: Events over the past week have also increased the probability that the BoJ will pursue a quarterly hiking cycle in the near term, in our view.
- id: E022
  text: This, coupled with a relatively neutral ' Summary of Opinions' from the BoJ’s September meeting, suggests that the likelihood of a consecutive hike in October is limited.
- id: E023
  text: September’s Tokyo CPI also signaled a resurgence in consumer inflation; although partly influenced by a policy factor, the data confirmed spillovers from higher energy and semiconductor prices, as well as wage-driven service inflation.
- id: E024
  text: A hawkish BanRep reinforced our conviction in our short MXNCOP position. We also took advantage of the hawkish surprise to initiate a Long Coltes 2031 UVR vs Pay 5y SOFR trade and a z36-3y COP basis payer.
- id: E025
  text: Colombia’s Banrep surprised again with a 25bp hike in its policy rate, above the market’s and our expectation for a pause at 12.0%. The probability of a 25bp hike at the next policy decision on 30 October now rises following Friday’s hike, we believe
- id: E026
  text: With inflation set to temporarily exceed the CNB’s tolerance band by early 2027, we also now see a 25bp rate hike in the Czech Republic in November, before a sustained hold into late 2027.
- id: E027
  text: In Hungary, the NBH is likely to remain on hold for now, until external risk sentiment improves. We have removed one of two 25bp cuts we pencilled in for Q4.
- id: E028
  text: This should materially improve the short - term inflation outlook which we had previously expected to breach the NBP’s tolerance band. This reduces the risk of the NBP hiking rates in the short term and could shift tightening out to early next year versus our revised expectation for a mini-rate hike cycle to kick off as early as November.
- id: E029
  text: A difference of 3 -4pp between Lula and Flavio Bolsonaro in this first round seems to be the neutral scenario, suggesting a tie in the second round between the two leading candidates – our poll aggregator currently shows Lula’s first round advantage at 3pp.
- id: E030
  text: We have revised our outlook for CEE central bank policy given the lack of a clear path for a swift and sustainable decline in energy and related product prices.
- id: E031
  text: 'Fundamentally we maintain that Hungary has bigger mitigating factors to help to stem rising near-term price pressures thanks, in part, to positive sentiment around its euro adoption plans – see Hungary: Euro vision, dated 4 June.'
