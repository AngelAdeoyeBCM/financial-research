exclusions:
- text: This week we take a look at the implications for FX markets, in particular the US dollar.
  code: META
  reason: Describes what the note covers.
- text: Does that answer the question?
  code: NON_CLAIM
  reason: Rhetorical question.
- text: How is your $16bn looking now Scott?
  code: NON_CLAIM
  reason: Rhetorical jibe; the point is made in the buyback-inadequacy claims.
- text: Given his avowed intent to reduce the size of the Fed’s balance sheet and known aversion to extending the duration of its Treasury holdings, how does this sit with Bessent’s moves last week?
  code: VAGUE
  reason: Rhetorical question that commits to no claim.
- text: Luckily for Chair Warsh, there is no Q&A following his speech.
  code: NON_CLAIM
  reason: Aside about the event format.
- text: The key questions remain if this will be followed by more JPY buying and, will the BoJ back up the moves with rate hikes?
  code: NON_CLAIM
  reason: Open questions; the BoJ view is captured elsewhere.
- text: All eyes switch to Jackson Hole now.
  code: NOT_LOAD_BEARING
  reason: Points to the upcoming event; the Warsh view is captured separately.
- text: It indicated that it would continue to be data dependent moving forward
  code: NON_CLAIM
  reason: Reports RBA guidance; no author view.
