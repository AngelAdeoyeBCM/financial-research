arguments:
- id: A001
  summary: 'BofA expects the Fed to hike 25bp at the September FOMC [S001]. Several points support this: the Fed''s choice is to hike or risk a bond spike [S003], CPI has all but locked in the hike [S018], Warsh''s Jackson Hole remarks and market pricing have raised the cost of disappointing [S019], and the twist flattening gives the Fed further justification [S020]. Pricing has shifted sharply [S008], sits firmly in the zone to support a hike [S055], and a hold would be historically unprecedented [S017]. The policy tools should shift up 25bp in parallel [S076]. The alternative is the Fed-hold scenario.'
  core_claim: S001
  premises:
  - S003
  - S018
  - S019
  - S020
  - S008
  - S055
  - S017
  risks: []
  conditions: []
  catalysts: []
  qualifiers: []
  implications:
  - S076
  alternatives:
  - SC003
- id: A002
  summary: 'The Fed faces a simple choice: hike or risk a large bond spike [S003]. This is because the bond likes orthodoxy, meaning rate hikes rather than buybacks are the most effective way to limit a rise in long-end rates [S004]. The Fed-hold scenario shows what the bond spike would look like.'
  core_claim: S003
  premises:
  - S004
  risks: []
  conditions: []
  catalysts: []
  qualifiers: []
  implications:
  - SC003
