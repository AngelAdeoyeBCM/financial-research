- text: 'History note: Fed never held with market pricing such high hike likelihood, using FOMC OIS.'
  code: NOT_LOAD_BEARING
  reason: Historical pricing background; cited context, not a claim the argument rests on.
- text: Today = 22bps priced.
  code: NOT_LOAD_BEARING
  reason: Data point without author reading.
- text: The sharp shift in Fed pricing was catalyzed by Warsh Jackson Hole (JH) speech + stronger labor & inflation data.
  code: NON_CLAIM
  reason: Reported event and background.
- text: For example, it would be dovish if Warsh starts referring to 3m inflation trends, given the residual seasonality in the PCE inflation data.
  code: TANGENTIAL
  reason: Illustrative signal of dovishness, not a separate committed outcome.
- text: If Warsh reverts to his prior stance of avoiding substantive discussions about the economic outlook and the stance of policy, he may field far fewer questions at the press conference.
  code: NOT_LOAD_BEARING
  reason: Peripheral conditional about press conference volume.
- text: Warsh can also point to Friday’s twist flattening of the Treasury curve as evidence that tighter policy is reinforcing inflation-fighting credibility, providing further justification for a hike.
  code: TANGENTIAL
  reason: Describes possible rhetoric Warsh could use rather than the author's own commitment.
- text: 'Bottom line: Fed expected to hike 25bp.'
  code: REDUNDANT
  reason: Restates the main takeaways already captured in the arguments.
- text: We're curious whether Warsh will retain the tweaks he made to his communication style at Jackson Hole.
  code: NON_CLAIM
  reason: Question rather than claim.
- text: While the SEP's days may be numbered, this meeting will still deliver an updated set of Fed projections.
  code: TANGENTIAL
  reason: Framing about SEP format, not load-bearing for the SEP arguments.
- text: It is the first part of a previously very out-of-consensus 75bps hike in ’26 call from BofA US Economics.
  code: NON_CLAIM
  reason: Reference to a prior house call; background.
