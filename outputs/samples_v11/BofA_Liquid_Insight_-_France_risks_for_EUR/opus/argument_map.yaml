exclusions:
- text: The next President could dissolve parliament and call for snap elections. In such a scenario, the first round of parliamentary elections would have to follow within 2-4 weeks
  code: NON_CLAIM
  reason: Institutional background from the key-dates table; the related fragmentation risk is captured in S009.
- text: 'We construct four components: 1) risk reversals, 2) MSCI France/MSCI Europe ratio, 3) 10y OAT-Bund spreads, and 4) FX positioning.'
  code: META
  reason: Methodology for building the France-risk proxy, not a claim.
- text: Our approach is inspired by Lina Fransson and Oskar Tysklind (2017), An index for financial conditions in Sweden, Sveriges Riksbank Economic Review 2017:1.
  code: META
  reason: Methodological attribution.
