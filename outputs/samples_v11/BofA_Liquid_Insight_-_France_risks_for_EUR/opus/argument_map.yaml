arguments:
- id: A001
  summary: France fiscal and political risks look reasonably, or at least partly, priced in FX [S001]. The support comes from FX options pricing of the election [S015], a historically large vol premium [S016], OAT-Bund spreads in rates [S020], how OAT-Bund widening has moved EUR-USD in the past [S021] and the underperformance of French equities [S023]. Sentiment and positioning do not stand out [S017][S018], and the stakes may be higher this time [S019].
  core_claim: S001
  premises:
  - S015
  - S016
  - S020
  - S021
  - S023
  risks: []
  conditions: []
  catalysts: []
  qualifiers:
  - S017
  - S018
  concessions:
  - S019
- id: A002
  summary: France poses downside risks to the EUR over the medium term [S002]. The main concerns are what the presidential election means for European integration [S008] and parliamentary fragmentation after a possible snap election [S009]. Budget-approval concerns add near-term risk [S010], and French risks drove past slumps in EUR sentiment [S013]. Economists and rates strategists add macro and fiscal concerns [S006][S007]. The low French REER, which reflects subdued inflation, is acknowledged as a counterpoint [S014].
  core_claim: S002
  premises:
  - S008
  - S009
  - S010
  - S013
  - S006
  - S007
  risks: []
  conditions: []
  catalysts: []
  qualifiers: []
  concessions:
  - S014
- id: A003
  summary: The next major France catalyst for the EUR is more likely the presidential election, possibly in Q1 2027 [S004], because the risks should matter more once the field is clearer [S024]. This assumes no major budget disruption [S005] and a budget that keeps the deficit unchanged [S011], which would likely require c 60bp of measures [S012]. Near-term budget concerns are a risk to this timing [S010].
  core_claim: S004
  premises:
  - S024
  risks:
  - S010
  conditions:
  - S005
  - S011
  - S012
  catalysts: []
  qualifiers: []
- id: A004
  summary: BofA holds a constructive medium-term EUR view [S003], and France is the downside risk to it [S002].
  core_claim: S003
  risks:
  - S002
  conditions: []
  catalysts: []
  qualifiers: []
- id: A005
  summary: Hedge France-related risks through CHF or GBP rather than EUR-USD [S025]. The reasons are France's downside risks to the EUR [S002], EUR-USD depending more on US policies and data [S026], and election vol pricing being most evident in EUR-GBP and EUR-CHF [S015].
  core_claim: S025
  premises:
