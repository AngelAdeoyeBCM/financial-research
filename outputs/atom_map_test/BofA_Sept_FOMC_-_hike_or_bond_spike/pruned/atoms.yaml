arguments:
- id: A001
  brief: Fed hikes 25bp in September
  summary: 'The Fed is likely to hike 25bp in September [S001]. The reasons given
    are: Friday''s CPI all but locks it in [S009]; Jackson Hole and stronger data
    drove the repricing [S008]; the cost of disappointing expectations is now high
    [S010]; the twist flattening gives further justification [S011]; rate pricing
    is firmly in hike territory [S012]; and a hold would be historically unprecedented
    [S013]. The ''hike or bond spike'' choice and policymakers'' understanding of
    the bond risk also support it. Policy tools shift up 25bp [S073], with no balance
    sheet changes [S074]. A Fed hold is the alternative.'
  conclusion: S001
  premises:
  - S009
  - S008
  - S010
  - S011
  - S012
  - S013
  - A002
  - A003
  qualifiers:
  - S074
  alternatives:
  - SC003
- id: A002
  brief: 'Fed choice: hike or bond spike'
  summary: 'The Fed''s choice is simple: hike or risk a large bond spike [S003], because
    the bond favours orthodoxy - rate hikes, not buybacks [S004]. The Fed-hold scenario
    sets out the spike.'
  conclusion: S003
  premises:
  - S004
  implications:
  - SC003
- id: A003
  brief: Fed and administration understand the bond risk
  summary: Warsh, the Fed and the Trump administration understand the bond risk of
    a hold [S014]. The Fed faces a hike-or-spike choice, and Trump should understand
    the bond-anchoring risk.
  conclusion: S014
  premises:
  - A002
  - A004
