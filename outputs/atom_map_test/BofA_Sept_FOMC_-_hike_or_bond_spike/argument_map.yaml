  summary: 'The USD will trade broadly sideways into year-end, ex-JPY [S085]. The reasons are that the bar for the Fed to out-hawk others is high and dollar sentiment has soured since July [S088]; the USD outcome turns on out-hawking [S007]. The author concedes the prospect of further hikes [S028] and the usual energy link to dollar strength [S089].'
