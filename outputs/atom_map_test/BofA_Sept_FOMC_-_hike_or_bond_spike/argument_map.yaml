arguments:
- id: A001
  brief: Fed hikes 25bp in September
  summary: 'The Fed is likely to hike 25bp in September [S001]. The reasons given are: Friday''s CPI all but locks it in [S009]; Jackson Hole and stronger data drove the repricing [S008]; the cost of disappointing expectations is now high [S010]; the twist flattening gives further justification [S011]; rate pricing is firmly in hike territory [S012]; and a hold would be historically unprecedented [S013]. The ''hike or bond spike'' choice and policymakers'' understanding of the bond risk also support it. Policy tools shift up 25bp [S073], with no balance sheet changes [S074]. A Fed hold is the alternative.'
  conclusion: S001
  premises: [S009, S008, S010, S011, S012, S013, A002, A003]
  qualifiers: [S074]
  implications: [S073]
  alternatives: [SC003]
- id: A002
  brief: 'Fed choice: hike or bond spike'
  summary: 'The Fed''s choice is simple: hike or risk a large bond spike [S003], because the bond favours orthodoxy - rate hikes, not buybacks [S004]. The Fed-hold scenario sets out the spike.'
  conclusion: S003
  premises: [S004]
  implications: [SC003]
- id: A003
  brief: Fed and administration understand the bond risk
  summary: Warsh, the Fed and the Trump administration understand the bond risk of a hold [S014]. The Fed faces a hike-or-spike choice, and Trump should understand the bond-anchoring risk.
  conclusion: S014
  premises: [A002, A004]
- id: A004
  brief: Trump should accept the tradeoff
  summary: Trump should understand the risks of bond un-anchoring [S018], because the administration's choice is between higher front-end and higher long-end rates [S015] and Bessent and Warsh will explain it [S016]. The author concedes Trump will not like the choice [S017].
  conclusion: S018
  premises: [S015, S016]
  concessions: [S017]
- id: A005
  brief: Warsh delivers a hawkish hike
  summary: 'Warsh is likely to deliver a hawkish hike with a Jackson Hole-style presser [S005], given the expected hike and the need to support the bond [S019]. The reaction depends on the communications mix [S025], and Waller may dissent dovishly [S026]. The implications are a supported USD [S020], challenged risk assets [S021], a challenge to the house bias for lower belly rates [S022] and support for the long-end asset swap view. A dovish presser is the alternative.'
  conclusion: S005
  premises: [A001, S019]
  qualifiers: [S025]
  concessions: [S026]
  implications: [S020, S021, S022, A007, SC001]
  alternatives: [SC002]
- id: A006
  brief: Hawkish hike brings modest twist flattening
  summary: A hawkish hike should lift front-end rates and modestly twist flatten the UST curve [S006]. A dovish hike or a hold would move markets more [S027]; both are alternatives.
  conclusion: S006
  premises: [A005]
  qualifiers: [S027]
  alternatives: [SC002, SC003]
- id: A007
  brief: Hawkish hike supports long-end asset swap view
  summary: A hawkish hike should support the constructive long-end asset swap spread view [S023], because lower growth and inflation risk and enhanced Fed credibility should support UST investor confidence [S024].
  conclusion: S023
  premises: [S024]
- id: A008
  brief: Further hikes in October and December
  summary: The Fed will hike again in October and December, for 75bp in 2026 [S028], unless data soften or communication turns dovish [S029]. The author concedes that the path beyond September is uncertain [S030].
  conclusion: S028
  conditions: [S029]
  concessions: [S030]
- id: A009
  brief: 2026 dot shows 50bp of hikes
  summary: Assuming a hike [S031], the 2026 median dot will show 50bp of hikes, implying another in October or December [S002].
  conclusion: S002
  assumptions: [S031]
- id: A010
  brief: Statement tweaked to justify the hike
  summary: If the Fed hikes [S031], the FOMC statement will get a few tweaks [S032] - inflation language rationalising the move [S033] and possibly a change to the strong-productivity comment [S034].
  conclusion: S032
  premises: [S033, S034]
  conditions: [S031]
- id: A011
  brief: Updated SEP despite its uncertain future
  summary: The meeting will deliver an updated SEP with first 2029 estimates [S035], even though the SEP's days may be numbered [S036].
  conclusion: S035
  concessions: [S036]
