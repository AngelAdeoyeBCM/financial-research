exclusions:
- text: We will be hosting a webinar later today, 08 February at 1400 UKT, with Marcus Diebel who covers Ocado within our European Equity Research team and also holds an Overweight recommendation.
  code: META
  reason: Event invitation.
- text: We will also offer an opportunity for Q&A.
  code: META
  reason: Event invitation.
- text: Please register here.
  code: NON_CLAIM
  reason: Call to action.
- text: Founded in 2000 as a pure-play online supermarket in the UK, Ocado is now more accurately described as a technology solutions partner for an international network of grocery retailers.
  code: NOT_LOAD_BEARING
  reason: Background; the Tech Solutions claim is carried by S003.
- text: 'Ocado now generates profit through two distinct but complimentary businesses: Technology Solutions, which offers vertically integrated software and physical retail solutions, predominantly via the Ocado Smart Platform (OSP) and Ocado Logistics, which provides fulfilment services to Ocado’s UK clients, including Ocado Retail Limited (ORL).'
  code: NOT_LOAD_BEARING
  reason: Segment description; not used as a reason in any argument.
- text: Ocado has long framed high cash burn as a positive, being that it signifies strong demand for its capex-intensive Solutions business.
  code: NOT_LOAD_BEARING
  reason: Historic management framing; no argument rests on it.
- text: The corollary, of course, is a consistent need for fresh capital.
  code: NOT_LOAD_BEARING
  reason: Historic framing; not weighed as a risk by the author.
- text: In this note we expand on the above the points, present summary models including at the consolidated Group-level but also for Tech Solutions, Ocado Logistics and ORL as well as offering deep dives into all three divisions.
  code: META
  reason: Document roadmap.
- text: We also outline our expectations for cash flow, including the crucial variable of capex, over the next three years.
  code: META
  reason: Document roadmap.
