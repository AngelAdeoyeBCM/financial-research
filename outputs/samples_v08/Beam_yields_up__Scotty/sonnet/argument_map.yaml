evidence:
- id: E001
  text: The broad conclusion? Well, we remain underweight the USD in our portfolio.
- id: E002
  text: Again, Secretary Bessent hardly instilled confidence by his words and actions last week and we expect this to continue to weigh on the dollar. We maintain our dollar short versus the Euro.
- id: E003
  text: Rising yields due to concerns over the level of the deficit/debt are much less positive.
- id: E004
  text: The 3m correlation between changes in the DXY and changes in yields is falling sharply for longer-duration yields (Figure 3). For the 30-yr it is now at just 12% and i28% for 10-yr yields.
- id: E005
  text: Scott Bessent’s nervousness over rising yields is understandable given that US debt interest payments this year are set to be over $1tr, or 3.3% of GDP, and are now higher than the primary deficit of $814bn (2.6% of GDP).
- id: E006
  text: This is clearly a huge problem and, by showing his hand last week, Bessent has alerted the market to his concerns, leaving US duration an unattractive investment opportunity at current yield levels.
- id: E007
  text: Will the buybacks be enough to stem rising yields? Unlikely given it only increased the minimum buyback from $2bn to $4bn dollars.
- id: E008
  text: Given Q3 will see issuance in the 10yr+ part of the yield curve of $231bn, the extra $16bn in buybacks is the definition of a drop in the ocean.
- id: E009
  text: Five megacap companies are expected to issue around $250bn in debt in 2026, double their $120bn in 2025. $400bn is estimated for 2027.
- id: E010
  text: In the first half of 2026 Japanese investors actually sold over $50bn in overseas long-term debt leading to a net surplus of over $110bn. That is money not going into USTs.
- id: E011
  text: We also maintain our CAD long versus the AUD. There is plenty of opportunity for more U-turns before meaningful trade sanctions are imposed on January 1st 2027. This week’s CAD reaction seems, to us at least, an over-reaction.
- id: E012
  text: Recent Canadian data releases have proved stronger than expected but both the Bank of Canada and the rates market have thus far failed to react. We also see the recent renewed trade spat with the US as a very moveable feast with plenty of TACO possible before January 1st 2027. With this in mind we stay overweight the CAD versus the AUD.
- id: E013
  text: The RBA has raised rates three times and is now taking a wait-and-see approach as unemployment remains elevated. The fallout from the Iran conflict could yet impact growth, spelling further weakness in the labour market. The AUD is currently the most overweight holding among real money investors. We maintain a short vs CAD.
- id: E014
  text: One other implication of rising yields is that it makes the FX carry trade much less compelling. Last week saw real money investors start to actively move out of carry positions (Figure 4) but positioning remains overweight. Our other broad indicators show that real money risk appetite remains positive so we are not too concerned yet but, should yields rise once more, carry would be an obvious loser.
- id: E015
  text: Given the tone of relative central bank speak and relative economic surprises we maintain longs versus GBP and the USD.
- id: E016
  text: Sterling has proven stubborn and the last month has seen real money buying back their underweight, despite a sluggish economy. However, BoE pricing is almost exactly the same as that for the EUR despite a more dovish message from the BoE and disappointing data. We maintain a GBP short versus the EUR this week.
- id: E017
  text: Economic surprises in the US have recently turned sharply lower. This suggests the bar for the Fed to hike in September is relatively high. That said, rate markets still have close to a 40% chance of a hike priced in for September. This makes the dollar particularly vulnerable in the near term.
- id: E018
  text: All of this is consistent, but with risk appetite positive and geopolitical risk elevated but stable, the CHF makes an ideal funder. The Machines have noticed and are short the CHF versus the JPY.
- id: E019
  text: We keep a JPY long versus the CHF.
- id: E020
  text: The BoJ has shifted more hawkish in tone as inflation remains above target. Further hikes look likely and we see their potential as an underpriced risk for 2026.
- id: E021
  text: We see unchanged policy through all of 2026.
- id: E022
  text: Hikes are coming with three fully priced over the next year.
- id: E023
  text: We maintain a neutral Kiwi stance.
- id: E024
  text: We stay neutral this week.
- id: E025
  text: We adopt a neutral stance for now.
- id: E026
  text: Chair Warsh has a needle to thread.
- id: E027
  text: Expect much continued talk of tackling inflation being the primary goal but, we fear, little of substance when it comes to the Fed’s actual reaction function.
- id: E028
  text: Again, we are happy to sit short of dollars into the gathering.
