evidence:
- id: E001
  text: Fed likely to hike 25bp.
- id: E002
  text: 'Fed faces simple choice at Sept FOMC: hike or risk large bond spike.'
- id: E003
  text: If the Fed does not hike with current pricing, it risks a sharp and disorderly UST long end move.
- id: E004
  text: US 30Y could rapidly test 5.75%; UST buybacks would be futile to stop it.
- id: E005
  text: Rates price this with ~85% likelihood, up from just 35% likelihood just 2 weeks ago.
- id: E006
  text: The sharp shift in Fed pricing was catalyzed by Warsh Jackson Hole (JH) speech + stronger labor & inflation data.
- id: E007
  text: Warsh likely to deliver hawkish hike, which should support higher front end rates & twist flattening of UST curve.
- id: E008
  text: We think JH, largely to support bond.
- id: E009
  text: If right, UST curve likely to twist flatten, USD to be supported, & risk challenged.
- id: E010
  text: Unless incoming data soften materially or Fed communication turns unexpectedly dovish, we expect additional rate hikes in both October and December.
- id: E011
  text: Assuming a hike, we expect the 2026 median dot to show 50bp of hikes this year, implying another rate increase in Oct/Dec.
- id: E012
  text: We think the 2027 median will likely show one cut (3.875%).
- id: E013
  text: 'Hawkish presser: If Warsh continues to sound inflation impatient & suggest recent data does not imply adequate disinflation trend, market likely to raise hike peak & pull forward timing.'
- id: E014
  text: This would likely see 2Y rates rise 5-10bps & 30Y rates lower by 5-10bps.
- id: E015
  text: 'Dovish presser: If Warsh implies unpopular hike, few hikes to follow, or improved signs in inflation trend, market is likely to reduce hike peak & push out timing.'
- id: E016
  text: This would likely see 2Y rates lower by 5bps & 30Y rates higher by 5bps.
- id: E017
  text: 'Fed hold: if Fed surprisingly holds, we expect a material front end rate decline & sharp twist steepening of the curve.'
- id: E018
  text: Initially, we might guess 2Y lower by 15-20bps & 30Y bond increase of 10- 15bps.
- id: E019
  text: Over time, we might expect the 30Y to increase towards 5.75% with limited investor confidence in the Fed.
- id: E020
  text: It should support our constructive long end asset swap spread view as lower growth & inflation risk + enhanced Fed credibility should support UST investor confidence.
- id: E021
  text: We expect Bessent & Warsh to effectively explain this tradeoff to Trump.
- id: E022
  text: Now with more than 3 hikes priced in for the Fed, the bar for this committee to “out-hawk” both expectations as well as other G10 central banks appears high.
- id: E023
  text: This is partly why despite the prospect of Fed hikes this year, we see the USD trading more-or-less sideways into year-end (ex-JPY)
- id: E024
  text: Of course, if the Fed opts to hold in the face of sticky inflation and market pricing, we expect the dollar to depreciate swiftly and significantly.
- id: E025
  text: But even in the event of a hike, the USD could soften with dovish or non-committal language from Warsh.
- id: E026
  text: Chair Warsh’s aversion to forward guidance would make this challenging.
- id: E027
  text: The dollar remains subdued going into the September FOMC, despite implied pricing rising sharply to ~85% probability of a hike, post CPI.
- id: E028
  text: Bear steepening has been a global phenomenon, resulting in less USD support from rate differentials
- id: E029
  text: Friday’s CPI data all but lock in a rate hike this week.
