  summary: The US debt interest burden is clearly a huge problem [S024]. Interest payments this year are set to top $1tr and exceed the primary deficit [S019], which first happened in 2025 [S020]. The CBO projects more than $2tr by 2035 [S022], from 2026 yield assumptions that look modest [S023]. The trend is not good [S021].
