document:
  title: 'DM FX Weekly: Beam yields up, Scotty?'
  publisher: State Street Markets
  authors:
  - Lee Ferridge
  desk: DM FX
  asset_classes:
  - FX
  - Rates
  source_email_sent_at: null
  publication_date: '2026-08-26'
  source_preprocessing:
  - Whitespace collapsed to single spaces.
  - Page furniture removed.
  source_notes:
  - Portfolio table and chart text are flattened in the source; table rows are used as evidence spans.
evidence:
- id: E001
  text: US Treasury Secretary Bessent last week managed to create a mini-crisis all of his own doing.
- id: E002
  text: By the surprise announcement that he was intending to increase the size of long-end Treasury buy-backs to $4bn from $2bn he highlighted to the market how concerned he was about rising yields.
- id: E003
  text: With the 30-yr last week reaching its highest yield since 2007 one can perhaps understand the worry, but the announcement (and subsequent TV appearances) only served to highlight the problem.
- id: E004
  text: The broad conclusion? Well, we remain underweight the USD in our portfolio.
- id: E005
  text: We also maintain our CAD long versus the AUD.
- id: E006
  text: There is plenty of opportunity for more U-turns before meaningful trade sanctions are imposed on January 1st 2027.
- id: E007
  text: This week’s CAD reaction seems, to us at least, an over-reaction.
- id: E008
  text: Short AUDCAD Open 12 Aug 2026 0.9835 0.9532 0.9988 -0.76% Policy stances/tone, relative data
- id: E009
  text: Long EURGBP Open 12 Aug 2026 0.8540 0.8700 0.8460 +0.16% Relative rate pricing
- id: E010
  text: Long CADCHF Closed 12 Aug 2026 0.5829 0.6015 0.5736 -1.63% Value, growth expectations
- id: E011
  text: Short CHFJPY Open 12 Aug 2026 196.28 186.19 201.30 -1.00% Value, growth expectations
- id: E012
  text: Long EURUSD Open 19 Aug 2026 1.1595 1.1845 1.1460 +0.63% Relative rate pricing
- id: E013
  text: While yields have been generally rising since the beginning of July, this was more of a drift higher than true signs of stress.
- id: E014
  text: In terms of the yield curve, we had seen some steepening but, again, nothing dramatic.
- id: E015
  text: 2s10s last week hit 50bp, up from 26bp at the end of June but still below the 70bp at which it started 2026.
- id: E016
  text: 2s30s reached 113bp last week, ahead of Bessent’s buyback announcement, which was its steepest since April. But it started the year at 137bp.
- id: E017
  text: As Figure 1 illustrates, the Treasury Secretary’s intervention has caused the media (and, hence, the market) to suddenly focus more keenly on the yield curve and, to a lesser extent (at least so far) the issue of debt sustainability.
- id: E018
  text: Scott Bessent’s nervousness over rising yields is understandable given that US debt interest payments this year are set to be over $1tr, or 3.3% of GDP, and are now higher than the primary deficit of $814bn (2.6% of GDP).
- id: E019
  text: 2025 was the first time that US interest payments were higher than the primary deficit and the trend is certainly not good.
- id: E020
  text: The CBO projects that net interest payments will top $2tr by 2035 (4.5% of GDP).
- id: E021
  text: Its 2026 projections, meanwhile, are based on an average 3m bill rate through the year of 3.3% and an average 10-yr yield of 4.1%.
- id: E022
  text: This is clearly a huge problem and, by showing his hand last week, Bessent has alerted the market to his concerns, leaving US duration an unattractive investment opportunity at current yield levels.
- id: E023
  text: Will the buybacks be enough to stem rising yields? Unlikely given it only increased the minimum buyback from $2bn to $4bn dollars.
- id: E024
  text: Over the quarter this is effectively an increase in buybacks in the 10-30yr area of the curve from $16bn to $32bn.
- id: E025
  text: Even then, it’s unlikely Treasury will accept $32b worth of par in offers.
- id: E026
  text: Given Q3 will see issuance in the 10yr+ part of the yield curve of $231bn, the extra $16bn in buybacks is the definition of a drop in the ocean.
- id: E027
  text: Increase market focus on a problem and then tackle it with a pea-shooter. Hardly the way to build confidence in US duration.
- id: E028
  text: When it comes to long-term debt sales, a major issue facing the US Treasury is that the US is no longer the only game in town.
- id: E029
  text: AI investment has led to a sharp increase in long duration corporate debt issuance, a fact bemoaned by Bessent last week when he argued they should be issuing more in the belly (3-7yr) part of the curve.
- id: E030
  text: Five megacap companies are expected to issue around $250bn in debt in 2026, double their $120bn in 2025. $400bn is estimated for 2027.
- id: E031
  text: At the same time, Japanese flows have turned much less supportive.
- id: E032
  text: As we wrote here, and as Figure 2 illustrates, in four of the last six years, Japan has seen a surplus is net portfolio flows into long-term debt as rising JGB yields make them attractive again both for overseas and domestic investors.
- id: E033
  text: In the first half of 2026 Japanese investors actually sold over $50bn in overseas long-term debt leading to a net surplus of over $110bn. That is money not going into USTs.
- id: E034
  text: For now at least, higher yields are offering the dollar some support but, this may not be true for much longer.
- id: E035
  text: The 3m correlation between changes in the DXY and changes in yields is falling sharply for longer-duration yields (Figure 3). For the 30-yr it is now at just 12% and i28% for 10-yr yields.
- id: E036
  text: Rising yields due to strong growth and the potential for or actual short-end rate hikes are clearly a dollar positive.
- id: E037
  text: Rising yields due to concerns over the level of the deficit/debt are much less positive.
- id: E038
  text: Again, Secretary Bessent hardly instilled confidence by his words and actions last week and we expect this to continue to weigh on the dollar.
- id: E039
  text: We maintain our dollar short versus the Euro.
- id: E040
  text: When it comes to the short- end, the 2-yr yield correlation is a still healthy 50%, but now all eyes will switch to this week’s Jackson Hole symposium and Kevin Warsh’s keynote address on Friday.
- id: E041
  text: You can find our in depth preview for Jackson Hole here, but suffice to say Chair Warsh has a needle to thread.
- id: E042
  text: He needs to avoid the muddled message he delivered following the July FOMC meeting and, in doing so, reassure long-end investors.
- id: E043
  text: Expect much continued talk of tackling inflation being the primary goal but, we fear, little of substance when it comes to the Fed’s actual reaction function.
- id: E044
  text: Given his avowed intent to reduce the size of the Fed’s balance sheet and known aversion to extending the duration of its Treasury holdings, how does this sit with Bessent’s moves last week?
- id: E045
  text: Luckily for Chair Warsh, there is no Q&A following his speech.
- id: E046
  text: Again, we are happy to sit short of dollars into the gathering.
- id: E047
  text: One other implication of rising yields is that it makes the FX carry trade much less compelling.
- id: E048
  text: Last week saw real money investors start to actively move out of carry positions (Figure 4) but positioning remains overweight.
- id: E049
  text: Our other broad indicators show that real money risk appetite remains positive so we are not too concerned yet but, should yields rise once more, carry would be an obvious loser.
- id: E050
  text: In our G10 portfolio we are short both the AUD (versus CAD) and GBP (versus the EUR).
- id: E051
  text: Long CADCHF 12 Aug 2026 0.5829 0.5736 24 Aug 2026 -1.63%
- id: E052
  text: Meanwhile, short CADCHF cost 22bp and was stopped out this week.
- id: E053
  text: Recent Canadian data releases have proved stronger than expected but both the Bank of Canada and the rates market have thus far failed to react.
- id: E054
  text: We also see the recent renewed trade spat with the US as a very moveable feast with plenty of TACO possible before January 1st 2027.
- id: E055
  text: With this in mind we stay overweight the CAD versus the AUD.
- id: E056
  text: The co-ordinated intervention in USDJPY by the MoF and US Treasury has changed the JPY dynamic, at least for the time being.
- id: E057
  text: One move by the BoJ is fully priced by year-end but could we see more?
- id: E058
  text: We keep a JPY long versus the CHF.
- id: E059
  text: Real money demand for the EUR is positive once again and they are now net buyers.
- id: E060
  text: Although the market already interprets the ECB as net hawkish, pricing for the next year is in line with that for the BoE.
- id: E061
  text: Given the tone of relative central bank speak and relative economic surprises we maintain longs versus GBP and the USD.
- id: E062
  text: New Zealand’s economy appears to have troughed and is starting to recover while inflation remains above the RBNZ’s target range.
- id: E063
  text: But a lot is expected from the RBNZ in the coming months.
- id: E064
  text: We maintain a neutral Kiwi stance.
- id: E065
  text: The SEK is typically a risk on currency, so it is often vulnerable during market shocks.
- id: E066
  text: This is exacerbated currently given oil sensitivity, investor positioning and a relatively low level of interest rates.
- id: E067
  text: However, if fears over the conflict recede, along with the oil price, there is room for the SEK to regain its footing.
- id: E068
  text: We stay neutral this week.
- id: E069
  text: NOK is vulnerable to further declines in energy prices, especially as there appears limited appetite for further geopolitical escalation, but the outlook remains uncertain.
- id: E070
  text: We adopt a neutral stance for now.
- id: E071
  text: Economic surprises in the US have recently turned sharply lower.
- id: E072
  text: This suggests the bar for the Fed to hike in September is relatively high.
- id: E073
  text: That said, rate markets still have close to a 40% chance of a hike priced in for September.
- id: E074
  text: This makes the dollar particularly vulnerable in the near term.
- id: E075
  text: We maintain a short against the EUR as a result.
- id: E076
  text: Swiss data surprises are the weakest in the G10, the SNB is the most dovish central bank and there is nothing priced in the rates market.
- id: E077
  text: All of this is consistent, but with risk appetite positive and geopolitical risk elevated but stable, the CHF makes an ideal funder.
- id: E078
  text: The Machines have noticed and are short the CHF versus the JPY.
- id: E079
  text: Sterling has proven stubborn and the last month has seen real money buying back their underweight, despite a sluggish economy.
- id: E080
  text: However, BoE pricing is almost exactly the same as that for the EUR despite a more dovish message from the BoE and disappointing data.
- id: E081
  text: We maintain a GBP short versus the EUR this week.
- id: E082
  text: The RBA has raised rates three times and is now taking a wait-and-see approach as unemployment remains elevated.
- id: E083
  text: The fallout from the Iran conflict could yet impact growth, spelling further weakness in the labour market.
- id: E084
  text: The AUD is currently the most overweight holding among real money investors.
- id: E085
  text: We maintain a short vs CAD.
- id: E086
  text: Still high inflation against a labo ur market balancing on a tightrope makes for an uncomfortable backdrop for the Fed.
- id: E087
  text: All eyes switch to Jackson Hole now.
- id: E088
  text: After one insurance hike, a second is fully priced this year with the door open for a third.
- id: E089
  text: With economic surprises trending higher, we expect pricing to remain steady.
- id: E090
  text: The BoJ has shifted more hawkish in tone as inflation remains above target.
- id: E091
  text: Further hikes look likely and we see their potential as an underpriced risk for 2026.
- id: E092
  text: The UK has weaker growth potential vs the Eurozone.
- id: E093
  text: Inflation is sticky but wage growth is slowing.
- id: E094
  text: What is priced looks a maximum outcome for higher rates.
- id: E095
  text: The SNB does not have much it can or should do with rates at zero and the currency expensive but not overly so.
- id: E096
  text: We see unchanged policy through all of 2026.
- id: E097
  text: The RBA unanimously decided to keep rates on hold at its July meeting.
- id: E098
  text: The Bank of Canada left rates on hold at its last meeting and increased its inflation forecast in its monetary policy report.
- id: E099
  text: The RBNZ hiked rates in July and the policy path is still towards more aggressive tightening.
- id: E100
  text: Hikes are coming with three fully priced over the next year.
- id: E101
  text: Hikes have resumed but, like the ECB, we suspect the reversal of previous easing will be shallow.
- id: E102
  text: The Riksbank has fewer inflation pressures to trouble it relative to other economies and will lag the ECB and other central banks in adjusting rates higher.
- id: E103
  text: Boost’s preference to fund its ideas in CHF is now universal.
- id: E104
  text: Two of last week’s trades - short CHFJPY and long USDCHF - are unchanged, but short AUDCAD is switched into a long CADCHF bias this week.
- id: E105
  text: Value plays a meaningful role in all three of Boost’s trades this week.
- id: E106
  text: Outside of this, rate differentials (carry) is a major factor behind the USDCHF trade and also a driver in CADCHF.
- id: E107
  text: Growth differentials are important in both CHFJPY and CADCHF
- id: E108
  text: Forest keeps two of its picks from last week – short AUDCAD and long USDCHF.
- id: E109
  text: However, it switches its CHFJPY short to long CADCHF.
- id: E110
  text: This leaves Forest picking the two of the same currency pairs as Boost – USDCHF and CADCHF.
- id: E111
  text: Five of the Machine’s six picks use CHF as the funder while CAD is the preferred long in three of them.
- id: E112
  text: Value, rate differentials and growth disparity are, as with Boost, the major drivers of Forest’s picks this week.
- id: E113
  text: Growth is a major driver of the short AUDCAD bias along with momentum.
- id: E114
  text: Value and rate differentials play the major role in USDCHF and CADCHF.
