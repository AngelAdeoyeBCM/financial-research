  summary: Bessent created a mini-crisis of his own doing [S001]. His buyback announcement [S002] showed the market how worried he is about yields [S003] and only highlighted the problem [S006]. It also turned media and market attention to the yield curve and debt sustainability [S018]. Before this, the rise in yields was only a drift [S014] and curve steepening was not dramatic [S015, S016, S017]. The author concedes his worry is understandable [S005], with the 30-yr yield at its highest since 2007 [S004].
