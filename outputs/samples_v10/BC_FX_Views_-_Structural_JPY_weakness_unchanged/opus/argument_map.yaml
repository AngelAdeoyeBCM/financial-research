- id: A001
  summary: 'Sustained JPY appreciation is unlikely [S002]. The reasons are unchanged fundamental headwinds [S013] and persistent structural JPY selling [S015]. The author concedes that intervention and BoJ hike prospects signal near-term upside [S001]. Qualifiers: USDJPY will likely swing both ways near term [S012], fresh highs no longer look likely [S085], and sustained appreciation would need structural changes [S086].'
