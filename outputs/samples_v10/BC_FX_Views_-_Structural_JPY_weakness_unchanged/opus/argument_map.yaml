- id: A002
  summary: The recent sharp JPY appreciation was likely driven by BoJ hike expectations, technical factors and FX supply-demand, including anticipated pension repatriation [S003]. Hawkish BoJ remarks lifted hike pricing [S023], the break below 155 opened further downside [S024], interventions improved supply-demand [S014], and the GPIF's August meeting triggered repatriation expectations [S025]. USDJPY fell from 164 to the 152s [S022].
