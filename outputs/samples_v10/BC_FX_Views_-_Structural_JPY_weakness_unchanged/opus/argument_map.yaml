document:
  title: 'FX Views: Structural JPY weakness unchanged'
  publisher: Barclays
  authors:
  - Shinichiro Kadota
  - Lhamsuren Sharavdemberel
  desk: FICC Research FX Strategy
  asset_classes:
  - FX
  - Rates
  source_email_sent_at: null
  publication_date: '2026-09-10'
  source_preprocessing:
  - Whitespace collapsed to single spaces.
  - Page furniture removed.
  source_notes:
  - Footnotes 1-3 and 5 appear inline in the extracted text and are treated as source content
  - Footnote 2 contains a double negative in the source and is normalised to the meaning it implies
evidence:
- id: E001
  text: Intervention has temporarily improved JPY supply-demand and faster BoJ hike prospects help rate gaps and risk premia, signalling technical near-term upside.
- id: E002
  text: Yet, rate gaps, equity risk premium, Takaichi policy concerns and structural JPY- selling flows remain, making sustained appreciation unlikely.
- id: E003
  text: The recent sharp JPY appreciation was likely driven by BoJ rate hike expectations, anticipation of pension funds shifting back toward domestic assets and technical factors.
- id: E004
  text: With the strong 155 support now broken, USDJPY is technically vulnerable to further downside tests.
- id: E005
  text: However, the recent JPY appreciation could unwind sharply back towards upper-150s if neither hawkish BoJ rate-hike expectations nor anticipation of pension funds shifting back toward domestic assets materializes.
- id: E006
  text: First, further JPY appreciation may require a surprise relative to already hawkish BoJ expectations.
- id: E007
  text: Second, the market impact of GPIF flows appears overstated and the expectations-driven JPY appreciation could reverse if no asset-allocation change is implemented.
- id: E008
  text: Other Japanese institutional investors are unlikely to follow pension repatriation.
- id: E009
  text: While USDJPY is likely to swing both ways depending on BoJ/GPIF expectations in the near term, the longer-term fundamental headwinds facing the JPY remain broadly unchanged.
- id: E010
  text: Supply/demand-based pressure for JPY depreciation is also persistent, making it difficult to see sustained JPY appreciation.
- id: E011
  text: Interventions have reduced the near-term net JPY selling pressure in FX supply- demand.
- id: E012
  text: Nevertheless, continued large-scale M&A, together with overseas investment associated with the new NISA scheme, suggest that structural JPY selling pressure will persist.
- id: E013
  text: Household investment in foreign assets through investment trusts continues at a pace exceeding that seen in both 2024 and 2025.
- id: E014
  text: While NISA-related investment typically tends to be concentrated at the beginning of the year when annual NISA allowances are reset, investment trust inflows have shown little sign of slowing even in the second half of this year, suggesting that households' JPY-selling activity remains intact.
- id: E015
  text: Japanese companies remain active in outward direct investment and the persistent JPY- selling pressure remains largely unchanged.
- id: E016
  text: Inward FDIs are only partially offsetting outward FDIs and revenue flow is biased toward JPY selling.
- id: E017
  text: The recent sharp JPY appreciation was likely driven by BoJ rate hike expectations, technical factors and FX supply-demand, including anticipation of pension repatriation.
- id: E018
  text: USDJPY fell from around 164 to nearly 155 following coordinated US-Japan intervention at end-July, then rebounded to around 160 in early September before reversing again and briefly plunging into the 152s on 8 September.
- id: E019
  text: We believe the renewed JPY appreciation reflected stronger BoJ rate hike expectations, technical factors and anticipation of pension funds shifting back toward domestic assets.
- id: E020
  text: First, hawkish remarks by BoJ officials including Board Member Takata pushed market pricing for rate hikes by year-end from around 40bp in August to 45-50bp in September.
- id: E021
  text: Second, from a technical perspective, the break below the 155 support, which held through both the Golden Week and July interventions, opened the way for further downside.
- id: E022
  text: Third, JPY's FX supply- demand has improved with rounds of interventions.
- id: E023
  text: Furthermore, the GPIF’s unusual August Board of Governors meeting triggered a sharp rise in expectations that the fund would shift back toward domestic assets.
- id: E024
  text: Given that 155 held even through two rounds of intervention, it is now more likely to act as resistance for the time being, while the 158s (200dma) is likely to be viewed as an even stronger resistance level (Figure 1).
- id: E025
  text: On the downside, key reference points are the YTD low of 152 and the post-Takaichi administration low of around 150.
- id: E026
  text: While further downside could technically extend to 145 (the level immediately before the Takaichi administration took office), market expectations for faster BoJ hikes could start to fade if USDJPY breaks below 150, suggesting sustained JPY appreciation would be difficult without a full-fledged change in fundamentals.
- id: E027
  text: The recent JPY appreciation could unwind sharply back towards the upper-150s if neither hawkish BoJ rate-hike expectations nor anticipation of pension funds shifting back toward domestic assets materializes.
- id: E028
  text: Amid hawkish comments from the BoJ officials and indicative comments from US Treasury Secretary Bessent on prospective hikes, the OIS market already prices almost quarterly rate hikes, taking the policy rate to nearly 1.9% by July next year (Figure 2), exceeding our forecast of hikes in September, January and July to 1.75%.
- id: E029
  text: Hence, unless the BoJ clearly signal quarterly hikes towards 2%, any JPY appreciation from a hawkish surprise would likely be limited if not unwound outright.
- id: E030
  text: While signaling of hikes beyond 2% could add further fuel to the JPY strength, the currently-priced 2% is already the central point of BoJ's neutral rate estimates, therefore rendering it unlikely at least at this point.
- id: E031
  text: Additionally, faster rate hike expectations have likely strengthened the JPY via not only the rate differential channel but also the compression of the Takaichi policy risk premium, by around three yen as noted below, indicating that a reversal of rate hike pricing could have greater JPY
- id: E032
  text: The meeting was therefore interpreted as a possible step toward changing the benchmark portfolio.
- id: E033
  text: However, Minister of Health, Labor and Welfare Ueno told reporters on 8 September that he does not think that the investment environment has not deviated significantly from the assumptions under benchmark portfolio, indicating some reservations towards allocation change at this point (Bloomberg, 8 September).
- id: E034
  text: Impact of the shift back into domestic assets is expected to be greater in the yen rates market, with the downward pressure on yields likely to be particularly pronounced in the superlong sector (see the report cited above).
- id: E035
  text: From the perspective of the US- Japan interest-rate differential, avoiding a sharp increase in expectations for Fed rate hikes will also be important in sustaining the JPY’s appreciation bias (see Curb your (y)enthusiasm, 6 September).
- id: E036
  text: Second, while the market impact of GPIF flows appears overstated, the expectations- driven JPY appreciation could reverse if no asset-allocation change is implemented.
- id: E037
  text: PM Takaichi and FM Katayama had already referred to changes in the pension fund's asset allocation in the first half of July.
- id: E038
  text: Market expectations intensified again after an unusual August GPIF meeting had taken up the discussions of the “Benchmark Portfolio Review and Other Matters Project Team.1 ”
- id: E039
  text: Whether the GPIF will actually decide to change its asset allocation remains unclear2 but when changing its asset allocation in the past, the GPIF has sought to avoid the market front-running its trades, by making official announcements only after the asset transfers had been completed.
- id: E040
  text: We therefore cannot rule out the possibility that the process will proceed without prior disclosure.
- id: E041
  text: In Rates and FX impact of GPIF allocation and retail JGB measures, 16 July, we noted that raising the expected return on domestic bonds from the 1.5% average across GPIF's four scenarios to 1.8%, in line with the current rise in interest rates, could justify a 5-10pp reallocation from foreign bonds to domestic bonds (far right of Figure 3).
- id: E042
  text: In other words, even without political pressure, some shift back toward domestic assets could be justified by the current level of yen rates.
- id: E043
  text: Given the GPIF's total assets of JPY320trn, a 5-10pp shift back to domestic assets would generate around JPY16-32trn of JPY buying, comparable with the scale of intervention this year, and the amount would be even larger if other pension funds are included (Figure 4)3 .
- id: E044
  text: However, because the GPIF would execute the reallocation with consideration to the market impact of its own flows, the effect on JPY appreciation would likely be much more limited than
- id: E045
  text: When the US-Japan short-term rate differential exceeds the threshold (149bp in our model), USDJPY’s sensitivity to the rate differential declines, while its sensitivity to the equity risk premium increases sharply.
- id: E046
  text: Indeed, the GPIF's asset management stipulations explicitly state that it should consider market size carefully, ensure that it does not itself incur excessive market impact, and, in particular, avoid concentrating the deployment or withdrawal of funds in any specific period4 .
- id: E047
  text: If part of the shift back to domestic assets were implemented by reallocating from unhedged foreign bonds to hedged foreign bonds, which are treated as domestic bonds in GPIF's asset allocation and had a limited balance of JPY1.6trn as of March 2026, it could exert widening pressure on short-term USDJPY xccy basis in addition to generating JPY buying.
- id: E048
  text: However, given the low yields on FX- hedged foreign bonds, this appears unlikely.
- id: E049
  text: Life insurers already sold a significant amount of foreign bonds amid the global duration selloff and rise in FX hedge costs during 2022-23.
- id: E050
  text: While higher JGB yields should attract more of their new money flows, we do not expect much JPY buying from foreign bond sales.
- id: E051
  text: Indeed, if they view underlying JPY headwinds as largely unchanged, they may instead see the current JPY strength as an opportunity to reengage in JPY selling via FX-unhedged foreign bonds (see FY25 life insurer results).
- id: E052
  text: Banks fund their foreign bond portfolios via repo markets; hence, repatriation, if any, should not drive much JPY buying flow.
- id: E053
  text: According to our USDJPY model5 , the sharp depreciation from 100 to above 160 over the past five years has been driven by 1) the widening US-Japan interest-rate differential, 2) a decline in the US equity risk premium and 3) the residual, which we interpret as a risk premium associated with the Takaichi administration’s “high-pressure economy policy” (Figure 5).
- id: E054
  text: The risk premium associated with “high-pressure economy policy” has been reflected in both bond and JPY weakness, with USDJPY and the 30y JGB term premium showing a closer relationship since last October, except during periods of FX intervention (Figure 6).
- id: E055
  text: Regressing USDJPY since last October on the 30y JGB term premium and an FX intervention dummy indicates that its relationship with the JGB risk premium explains most of the JPY depreciation over this period.
- id: E056
  text: As for “high-pressure economy policy, ” the BoJ’s policy stance has become more hawkish, possibly under US pressure following coordinated US-Japan intervention, and the portion of the JGB term premium attributable to concerns about the BoJ falling behind the curve has declined.
- id: E057
  text: For example, three out of the six yen drop in USDJPY since end-August as BoJ rate hike pricing increased can be explained by JGB term premia, indicating the impact from fading behind-the-curve concern.
- id: E058
  text: The fair value implied by this model is around 157 for USDJPY, pointing to some undershooting , which likely reflect speculative positioning that may be prone to changes in expectations around BoJ and GPIF etc.
- id: E059
  text: 'Additionally, the Takaichi administration continues to press ahead with the core element of its agenda: fiscal expansion.'
- id: E060
  text: Budget requests for FY27 reached JPY143.1trn, exceeding the combined total of the FY26 supplementary budget and FY27 initial budget of JPY140.6trn, and are likely to rise further once unspecified requests are included.
- id: E061
  text: With a reasonably hawkish BoJ hiking path already priced in, the risk that renewed fiscal concerns push JGB term premia higher and weaken the JPY at the same time warrants attention.
- id: E062
  text: Longer-term fundamental and supply/demand-based pressure for JPY depreciation is persistent and makes it difficult to see sustained JPY appreciation.
- id: E063
  text: In addition to fundamental factors – including the still-wide US-Japan interest-rate differential even with faster BoJ hikes, the low equity risk premium, and concerns over the Takaichi administration’s “high-pressure economy policy” – FX supply-demand remains structurally biased toward JPY selling, excluding the temporary improvement from intervention.
- id: E064
  text: Persistent intervention concerns (see Appendix on scope for additional interventions) mean that a move to fresh highs no longer appears likely.
- id: E065
  text: However, more sustained medium- to long-term JPY appreciation is difficult to see without structural changes such as 1) full-fledged convergence in US-Japan interest-rate differentials through Fed rate cuts, 2) a rise in the equity risk premium driven by a reversal of the AI-led equity rally narrative, or 3) a shift in the Takaichi administration’s reflationary policy stance.
- id: E066
  text: On a four-quarter moving-average basis, FX supply-demand for JPY (excluding flows that do not drive FX spot transactions6 ) shows that net JPY selling narrowed from around JPY20trn last year to roughly JPY10trn as of Q2 26, reflecting JPY-buying intervention during Golden Week and other operations (Figure 7).
- id: E067
  text: With the additional JPY15trn intervention at end-July also reflected, the balance is likely to shift to net JPY buying of around JPY7trn in Q3.
- id: E068
  text: Looking at FX supply-demand in recent years, “overseas investment, etc. ” (JPY selling), centered on household overseas securities investment through the new NISA scheme and corporate outward direct investment, has been running at around JPY40trn, while the current account surplus (JPY buying) has been around JPY20trn, leaving net flows on a JPY-selling trend of roughly JPY20trn.
- id: E069
  text: JPY-buying intervention since the start of the year, totaling JPY27trn, has more than offset these net JPY sales.
- id: E070
  text: Of course, our FX supply-demand analysis does not explicitly include speculative positioning, and part of the intervention may have been absorbed by position adjustments among speculative investors (speculative positions declined sharply after the July intervention; Figure 8).
- id: E071
  text: As noted above, inward direct investment flows should gradually ease the additional pressure, but will not immediately alter the overall supply-demand balance.
- id: E072
  text: As shown in the following sections, 1) active yen selling by retail investors via New NISA is recently accelerating and it is likely to persist unless the AI equity narrative sees a significant change, and 2) with regards to corporate investment flows, inward FDIs are only partially offsetting outward FDIs and revenue flow is biased toward JPY selling.
- id: E073
  text: While pension repatriation may generate one-off JPY16-32trn JPY buying as noted above, we do not expect other institutional investors to follow suit.
- id: E074
  text: Hence, as long as the active investment outflows from retail investors and corporations continue to exceed the current account surplus, structural supply-demand conditions will likely remain a headwind to the JPY, in our view.
- id: E075
  text: Investment trusts are a popular investment vehicle, and household holdings of investment trusts reached a record JPY165trn at end-2025, supported by the new NISA scheme introduced in 2024.
- id: E076
  text: 'However, more than 90% of investment trust inflows have gone into products targeting overseas assets, and households’ active investment stance has contributed to JPY depreciation (see JPY: Household investment in overseas assets and implications for the JPY, 8 June).'
- id: E077
  text: JPY selling associated with NISA investment is accelerating.
- id: E078
  text: Individual investor inflows into NISA-eligible investment trusts totaled JPY12.6trn in 2024, of which JPY11.7trn targeted overseas assets, and JPY9.9trn in 2025, of which JPY9.7trn targeted overseas assets.
- id: E079
  text: YTD flows in 2026 have already reached JPY11.5trn, including JPY9.4trn invested in overseas assets.
- id: E080
  text: NISA- related investment is typically concentrated at the start of the year when annual allowances reset, but investment trust flows have shown no slowdown even in H2 this year.
- id: E081
  text: By investment destination, flows into investment trusts targeting domestic assets increased in June and July, but slowed from August, with no sign of a shift back toward JPY assets (Figure 9).
- id: E082
  text: Meanwhile, overseas asset investment through investment trusts has continued at a faster pace than in 2024 and 2025, suggesting that JPY selling pressure from individual investors has not receded even in H2 (Figure 10).
- id: E083
  text: Annualizing YTD overseas investment through NISA noted above implies JPY selling of JPY14.1trn, up JPY3.4trn y/y.
- id: E084
  text: Such active investment flows into overseas equity markets (especially in the US) are likely to persist unless the AI equity narrative sees a significant change.
- id: E085
  text: Japanese companies remain active in outward direct investment and the persistent JPY- selling pressure generated by this, together with robust outward portfolio investment, remains largely unchanged.
- id: E086
  text: Japanese corporate M&A has continued to expand since the COVID pandemic, with deal sizes also increasing.
- id: E087
  text: The average deal size rose to JPY45.6bn in 2025, reflecting the weak JPY environment and large transactions such as Nippon Steel’s acquisition of US Steel.
- id: E088
  text: Expansion is expected to continue at roughly the same pace in 2026, supported by factors including SoftBank Group’s additional investment in OpenAI, and
- id: E089
  text: At the same time, the weak JPY has increased the investment appeal of Japanese companies to overseas firms in recent years, while improvements in Japanese corporate governance have also provided a tailwind7 , and the resulting expansion of inward direct investment is beginning to offset some of the JPY selling pressure associated with Japanese corporate M&A.
- id: E090
  text: The government has continued to promote inward direct investment, and growth in inward direct investment flows has consequently begun to outpace that in outward direct investment flows.
- id: E091
  text: Inward direct investment flows totaled JPY6.9trn in 2025, still well below outward direct investment flows of JPY32.6trn, but increased by JPY4trn y/y, exceeding the JPY1.1trn rise in outward direct investment (Figure 12).
- id: E092
  text: Excluding the pandemic period, this was the first such occurrence since 2016.
- id: E093
  text: However, the reinvestment of direct investment income appears to differ between inward and outward investment.
- id: E094
  text: Japanese companies’ outward direct investment primarily consists of long-term investment involving local production, and profits earned locally are often reinvested.
- id: E095
  text: By contrast, much of the direct investment into Japan is thought to consist mainly of equity acquisitions by overseas investment funds8 , which may be more likely to lead to income outflows through demands for higher dividends and other channels.
- id: E096
  text: We therefore believe that while the expansion of inward direct investment may ease JPY selling pressure in the short term, it could also generate sustained pressure for JPY depreciation over the longer term through dividend payments and related outflows.
- id: E097
  text: The Ministry of Finance has conducted record JPY-buying interventions.
- id: E098
  text: The MoF reported a JPY-buying/USD-selling intervention of JPY15.4trn at end-July, the largest monthly total on record.
- id: E099
  text: Including the intervention from late April to early May, cumulative interventions in 2026 have reached JPY27.1trn, also setting a new annual record.
- id: E100
  text: The scale of the US intervention has not been disclosed, but past cases suggest that it was likely limited.
- id: E101
  text: In any event, what matters most in coordinated intervention is not the amount itself, but the signaling effect of US participation.
- id: E102
  text: Past US FX interventions have been small, at around USD1bn.
- id: E103
  text: 'Over the past 30 years, the US has participated in only three FX interventions: coordinated US-Japan JPY-buying/USD-selling intervention in 1998 (USD0.83bn); G7 EUR-buying/USD-selling intervention in 2000 (USD1.34bn); and G7 JPY-selling/USD-buying intervention in 2011 (USD1bn).'
- id: E104
  text: All were coordinated with overseas authorities and the amount per intervention was around USD1bn, substantially smaller than Japan’s unilateral interventions.
- id: E105
  text: The funding was also split evenly between the US Treasury’s Exchange Stabilization Fund (ESF) and the Fed’s SOMA account, leaving the US Treasury’s share at only about USD0.5bn.
- id: E106
  text: The US appears to have played an important signaling role in the coordinated intervention.
- id: E107
  text: The New York Fed reportedly sold EURJPY during the intervention at end-July, but no significant change has been observed in the SOMA account’s holdings of EUR or JPY.
- id: E108
  text: The intervention was therefore likely funded using the ESF’s holdings of foreign currency and foreign-currency-denominated assets (a combined USD4.4bn in JPY and EUR; Figure 13).
- id: E109
  text: If so, the effective size of the US intervention was likely well below the “USD5-10bn” reportedly noted in Treasury Secretary Bessent’s memo (Reuters, 31 July).
- id: E110
  text: In short, while the US again played an important signaling role in the coordinated intervention, Japan appears to have provided most of the actual funding.
- id: E111
  text: Although the need has receded, Japan still has ample capacity for further FX intervention.
- id: E112
  text: In a 31 August interview with CNBC, Treasury Secretary Bessent said, “it’s my belief that the Japanese government and that the BOJ will do the things that will lead to a stronger yen. ”
- id: E113
  text: This could be interpreted as signaling that the initiative for further JPY-strengthening measures and, if necessary, FX intervention now rests with the Japanese authorities.
- id: E114
  text: The JPY’s recent appreciation has reduced the need for intervention, but even after conducting the largest intervention on record in 2026, the MoF still held USD1.09trn in foreign reserves as of end-June (Figure 14).
- id: E115
  text: In addition, according to the MoF statement on 3 August, the authorities plan to utilise the FIMA Repo Facility in the future, which would enable them to raise intervention funds flexibly without having to sell their US Treasury holdings.
- id: E116
  text: Even if depreciation pressure on the JPY intensifies again, the Japanese authorities should retain ample intervention capacity.
- id: E117
  text: depreciation pressure than simply implied by rate changes.
- id: E118
  text: 'corporate M&A therefore remains a source of downward pressure on the JPY (Figure 11; see JPY: 2026 FDI outlook and FX implications, 22 May).'
