- id: A005
  summary: Further JPY appreciation may require a surprise relative to already hawkish BoJ pricing [S007]. OIS prices a rate near 1.9% by July 2027 [S033], above Barclays' 1.75% forecast [S034][S035]. Unless the BoJ signals quarterly hikes towards 2% [S036], JPY gains from a hawkish surprise would likely be limited [S037]. Signalling hikes beyond 2% could fuel JPY strength [S038] but is unlikely [S040], because 2% is the centre of BoJ neutral-rate estimates [S039]. Hike pricing likely strengthened the JPY via the risk premium too [S041], so a reversal could hit the JPY harder [S042].
  core_claim: S007
  supporting:
