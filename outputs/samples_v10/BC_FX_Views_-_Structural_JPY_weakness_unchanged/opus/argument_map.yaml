- id: A003
  summary: With 155 broken, USDJPY is technically vulnerable to further downside tests [S004]. The break below 155 opened the way lower [S024], and 155 had held through two interventions [S026]. 155 should now act as resistance [S027], with the 158s (200dma) stronger still [S028]. Downside reference points are 152 and 150 [S029], and downside could extend to 145 [S030]. If USDJPY breaks 150 [S031], BoJ hike expectations could fade [S032]. Sustained appreciation remains unlikely [S002].
  core_claim: S004
