  reason: Methodology citation; no argument depends on it.
- text: French political developments have a distinct impact on risk reversals, particularly seen in EURUSD
  code: REDUNDANT
  reason: Exhibit 3 title; restates risk reversal evidence already covered.
- text: Wider OAT-Bund spread by 1pp comes alongside c. 4% weaker EUR-USD
  code: REDUNDANT
  reason: Exhibit 9 title; restates the OAT-Bund sensitivity already captured in the body statement.
- text: Non-Euro area investors have turned against French equities since the snap National Assembly elections in June 2024
  code: REDUNDANT
  reason: Exhibit 11 title; the inflow point is captured in the body text.
- text: Forward vol premium vs ATM*, red indicates a premium while blue indicates a discount
  code: NON_CLAIM
  reason: Table legend for forward volatility data; no claim stated.
- text: 'Global FX weekly: Means to a Yen, 4 September 2026'
  code: NON_CLAIM
  reason: Listing of other research publications; not a claim in this note.
