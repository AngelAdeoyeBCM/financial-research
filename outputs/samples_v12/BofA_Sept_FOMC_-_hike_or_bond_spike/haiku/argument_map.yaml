evidence:
- id: E001
  text: Fed likely to hike 25bp. SEP = 50bps total hikes in '26.
- id: E002
  text: 'Fed choice is simple: hike or bond spike. Bond likes orthodoxy.'
- id: E003
  text: Warsh likely to deliver hawkish hike, which should support higher front end rates & twist flattening of UST curve.
- id: E004
  text: USD outcome will be determined by Fed ability to "out-hawk" mkt expectations & other G10 central banks.
- id: E005
  text: UST long end likes orthodoxy; higher front end rates = most effective way to limit long end rate rise
- id: E006
  text: Orthodoxy = use rate hikes to slow inflation & quell long end rate spike (not buybacks).
- id: E007
  text: The sharp shift in Fed pricing was catalyzed by Warsh Jackson Hole (JH) speech + stronger labor & inflation data.
- id: E008
  text: It is the first part of a previously very out-of-consensus 75bps hike in ’26 call from BofA US Economics.
- id: E009
  text: Rate pricing is firmly in the zone to support a hike (Exhibit 5).
- id: E010
  text: Friday’s CPI data all but lock in a rate hike this week.
- id: E011
  text: Chairman Warsh's Jackson Hole remarks, together with current market pricing, have raised the cost of disappointing expectations significantly.
- id: E012
  text: Warsh can also point to Friday’s twist flattening of the Treasury curve as evidence that tighter policy is reinforcing inflation-fighting credibility, providing further justification for a hike.
- id: E013
  text: 'Fed faces simple choice at Sept FOMC: hike or risk large bond spike.'
- id: E014
  text: If the Fed does not hike with current pricing, it risks a sharp and disorderly UST long end move.
- id: E015
  text: US 30Y could rapidly test 5.75%; UST buybacks would be futile to stop it.
- id: E016
  text: Bond price action, including post Friday’s CPI, shows the bond likes orthodoxy (Exhibit 2).
- id: E017
  text: 'History note: if market pricing remains stable & the Fed does not hike, it would represent an unprecedented dovish hold (using FOMC OIS data back to ’07).'
- id: E018
  text: 'Fed hold: if Fed surprisingly holds, we expect a material front end rate decline & sharp twist steepening of the curve.'
- id: E019
  text: Treasury buybacks would likely prove futile to stop the move, especially with their stumble out the gate.
- id: E020
  text: Sept FOMC communications likely lean hawkish.
- id: E021
  text: SEP will show 50bps of total hikes in ’26, Waller may dovish dissent.
- id: E022
  text: If the Fed raises rates, Gov. Waller might dissent, depending on his estimate of Aug core PCE.
- id: E023
  text: 'Big Q: which Warsh in presser? July FOMC or JH Warsh? We think JH, largely to support bond.'
- id: E024
  text: 'Key Q will be Warsh presser: we expect more JH than July FOMC.'
- id: E025
  text: If right, UST curve likely to twist flatten, USD to be supported, & risk challenged.
- id: E026
  text: If wrong, bigger Bessent “house” needed for bond.
- id: E027
  text: Larger market move would likely come from dovish hike or Fed hold.
- id: E028
  text: 'Fed hike: rate reaction will depend on mix of Fed communications.'
- id: E029
  text: 'Hawkish presser: If Warsh continues to sound inflation impatient & suggest recent data does not imply adequate disinflation trend, market likely to raise hike peak & pull forward timing.'
- id: E030
  text: If he asserts that the Sep hike (if it happens) was the first in a sequence of rate increases, markets might quickly price in over 100bp of hikes, as they did with the ECB.
- id: E031
  text: We might guess total hikes of 100bps & 60-65bps by end ’26.
- id: E032
  text: This would likely see 2Y rates rise 5-10bps & 30Y rates lower by 5-10bps.
- id: E033
  text: Bond yields lower due to downside growth & inflation risk + more credible Fed = return to orthodoxy.
- id: E034
  text: 'Dovish presser: If Warsh implies unpopular hike, few hikes to follow, or improved signs in inflation trend, market is likely to reduce hike peak & push out timing.'
- id: E035
  text: We might guess total hikes drop to 85 & 40-45bps by end ’26.
- id: E036
  text: This would likely see 2Y rates lower by 5bps & 30Y rates higher by 5bps.
- id: E037
  text: Bond yields higher due to dovish Fed action & confusion about Warsh policy direction / reaction function.
- id: E038
  text: If he attempts a "dovish hike" by reassuring markets that the Fed will proceed cautiously, markets might once again question the Fed's commitment to the 2% inflation target.
- id: E039
  text: Total hikes to decline to 65-75bps with 30-35bps by end ’26.
- id: E040
  text: Initially, we might guess 2Y lower by 15-20bps & 30Y bond increase of 10- 15bps.
- id: E041
  text: Twist steepening would come from a lower near term policy path & perceived very high bar to hike + long end rates that would reflect higher inflation risk premium & Warsh credibility discount.
- id: E042
  text: Over time, we might expect the 30Y to increase towards 5.75% with limited investor confidence in the Fed.
- id: E043
  text: 'Bullish USD case: The Fed hikes and some combination of the following are met: 1) The SEP shows broadening support for additional hikes (relative to the June SEP); 2) growth and inflation forecasts are elevated even in the context of further hike guidance; 3) Chair Warsh himself (intentionally or unintentionally) offers some indication that a more prolonged campaign is necessary to return inflation on the path to 2%.'
- id: E044
  text: This likely sees increased market-implied likelihood that the Fed hikes at least 100bp and/or brings current expectations forward.
- id: E045
  text: Chair Warsh’s aversion to forward guidance would make this challenging.
- id: E046
  text: 'Bearish USD case: Of course, if the Fed opts to hold in the face of sticky inflation and market pricing, we expect the dollar to depreciate swiftly and significantly.'
- id: E047
  text: But even in the event of a hike, the USD could soften with dovish or non-committal language from Warsh.
- id: E048
  text: Markets may not have the patience for anything that sounds like a “one and done” type event under the veil of “no forward guidance”.
- id: E049
  text: Any messaging that muddles 98.5 99.0 99.5 100.0 100.5 101.0 101.5 102.0 20 30 40 50 60 70 80 90 100 Jun-26 Jun-26 Jul-26 Aug-26 Aug-26 Sep'26 FOMC hike probability (%) DXY (RHS) Aug CPI July FOMC -5 0 5 10 15 20 25 30 35 40 45 UK 2Y CA 2Y US 2y GER 2Y JP 2Y UK 10Y US 10Y CA 10Y GER 10Y JP 10Y UK 30Y CA 30Y US 30Y GER 30Y JP 30Y Sovereign yield change since 31 Aug (bp) 6 Liquid Insight | 14 September 2026 the reaction function further (as was the case in July) that results in rising back-end yields would also likely see the USD fall in tandem.
- id: E050
  text: A more restrained SEP dot-plot could also weigh on the dollar if it appears the broader committee (outside of the already identified hawkish members) was reluctant to tighten policy in the current environment.
- id: E051
  text: If the Fed hikes, we think the language around inflation will be modified to rationalize the move.
- id: E052
  text: For example, the statement might note that progress on inflation has slowed or that the rate increase was aimed at delivering price stability.
- id: E053
  text: The comment that productivity growth is strong might also be altered due to soft productivity readings over the last three quarters.
- id: E054
  text: While the SEP's days may be numbered, this meeting will still deliver an updated set of Fed projections.
- id: E055
  text: The forecasts will also include policymakers' first estimates for 2029, which are likely to be very similar to the longer-run projections.
- id: E056
  text: Assuming a hike, we expect the 2026 median dot to show 50bp of hikes this year, implying another rate increase in Oct/Dec.
- id: E057
  text: Unless incoming data soften materially or Fed communication turns unexpectedly dovish, we expect additional rate hikes in both October and December.
- id: E058
  text: We think the 2027 median will likely show one cut (3.875%).
- id: E059
  text: It would be reasonable for the Fed to pencil in a cut at some stage next year, since many policymakers will likely assume that higher rates will help quell inflation.
- id: E060
  text: We think it will, although our conviction is low as it may be easier to reflect those changes ex-post.
- id: E061
  text: If the revisions are incorporated, we would expect both the headline and core inflation projections for 2026 to be marked down by roughly 30bp.
- id: E062
  text: Beyond this year, we expect the Fed to lower its growth forecasts by 0.1pp, to 2.2% in 2027 and 2.1% in 2028, reflecting the somewhat higher expected rate path over this year and next.
- id: E063
  text: We also expect the headline and core inflation projections for 2027 to be Liquid Insight | 14 September 2026 3 revised down by 0.1pp.
- id: E064
  text: The u-rate, however, is already two-tenths below the median projections for the end of this year and next.
- id: E065
  text: So we expect those medians to move down as a mark-to-market, despite the higher policy trajectory.
- id: E066
  text: In sum, aside from changes to the policy path and the potential inflation revisions stemming from the PCE methodology update, SEP changes should be relatively modest.
- id: E067
  text: Assuming the Fed hikes, Chair Warsh will almost certainly field questions about the policy path going forward.
- id: E068
  text: We also expect Warsh to be asked why the Fed didn't just hike in July.
- id: E069
  text: What has changed? We think he will probably say that progress on underlying inflation has been insufficient.
- id: E070
  text: He might also point to the increase in oil as upside risk to inflation, though that would contradict his prior stance that oil shocks should be treated as one-offs.
- id: E071
  text: For example, it would be dovish if Warsh starts referring to 3m inflation trends, given the residual seasonality in the PCE inflation data.
- id: E072
  text: Or if he brings up the Dallas Fed's trimmed-mean PCE metric (running at 2.3% on a 12m basis), after having abandoned it at Jackson Hole.
- id: E073
  text: We found that speech to be more transparent about his outlook and, as mentioned above, his reaction function.
- id: E074
  text: In our view, greater transparency decreases the risk of miscommunication.
- id: E075
  text: If Warsh reverts to his prior stance of avoiding substantive discussions about the economic outlook and the stance of policy, he may field far fewer questions at the press conference.
- id: E076
  text: We think Warsh, others at Fed, & Trump admin understand bond risk with Sept hold.
- id: E077
  text: 'For Trump admin, their choice is likely: tolerate modestly higher front end rates or materially higher long end rates.'
- id: E078
  text: Trump won’t like the choice set but should understand risks of bond un-anchoring & market implications.
- id: E079
  text: We expect Bessent & Warsh to effectively explain this tradeoff to Trump.
- id: E080
  text: If right, this will challenge our prior bias for lower belly rates with higher front end rates & twist flattening on curve.
- id: E081
  text: It should support our constructive long end asset swap spread view as lower growth & inflation risk + enhanced Fed credibility should support UST investor confidence.
- id: E082
  text: Dollar sentiment has soured ever since Chair Warsh’s July FOMC press conference raised credibility concerns on lack of an articulated plan to address persistently above-target inflation.
- id: E083
  text: Since then, the market has received a mix of signals, including an attempted course correction from Chair Warsh at Jackson Hole (bullish), a strong August labor report (bullish), dovish comments from the Fed’s Williams and Waller (bearish), and the Treasury’s buyback gambit to suppress US yields (bearish).
- id: E084
  text: Part of the puzzle lies in the broader re- pricing of central banks and curves globally.
- id: E085
  text: 'Exhibit 8: Bear steepening has been a global phenomenon, resulting in less USD support from rate differentials'
- id: E086
  text: Now with more than 3 hikes priced in for the Fed, the bar for this committee to “out-hawk” both expectations as well as other G10 central banks appears high.
- id: E087
  text: 'This is partly why despite the prospect of Fed hikes this year, we see the USD trading more-or-less sideways into year-end (ex-JPY) (see report: G10 FX back-to-school: dollar unloaded 08 September 2026).'
- id: E088
  text: With these evolving expectations, there remains considerable two-way risk for the USD at Wednesday's meeting.
- id: E089
  text: The dollar remains subdued going into the September FOMC, despite implied pricing rising sharply to ~85% probability of a hike, post CPI.
- id: E090
  text: Since ’07, there have been 74 meetings where market priced some hike likelihood & Fed held; the vast majority of these imply very low Fed hike likelihood (Exhibit 6).
- id: E091
  text: Rates price Sept FOMC hike with ~85% probability, up sharply in recent weeks (Exhibit 4).
- id: E092
  text: The Fed is now widely expected to hike Wednesday by 25bps.
- id: E093
  text: 'Exhibit 5: 90% of historical hawkish Fed surprises are <=3bps'
