- id: A001
  summary: 'The Fed is likely to hike 25bp in September [S001]. The reasons given are: the shift in pricing after Jackson Hole and stronger data [S008]; the higher cost of disappointing expectations [S019]; Friday''s twist flattening as justification [S020]; rate pricing being firmly in hike territory [S053]; and the Fed and the administration understanding the bond risk [S067]. The ''hike or bond spike'' choice and Trump''s expected acceptance also support it. A Fed hold is the alternative.'
  conclusion: S001
  premises:
  - S008
  - S019
  - S020
  - S053
  - S067
  - A002
  - A023
  risks: []
  conditions: []
  catalysts: []
  qualifiers: []
  alternatives:
  - SC003
- id: A002
  summary: 'The Fed''s choice is simple: hike or risk a large bond spike [S003]. This is because the long end favours orthodoxy, meaning rate hikes rather than buybacks [S004]. The bond-spike consequences are set out in the Fed-hold scenario.'
  conclusion: S003
  premises:
  - S004
  risks: []
  conditions: []
  catalysts: []
  qualifiers: []
  implications:
