  source_notes: []
evidence:
- id: E001
  text: French fiscal and political developments look reasonably priced for now in FX. A simple proxy for France-related risks stands one standard deviation above its post-2015 average, the highest level since the 2017 presidential election (Chart of the day).
- id: E002
  text: We continue to see France as posing downside risks to our otherwise constructive medium-term view on the EUR.
- id: E003
  text: However, absent significant disruption around the 2027 budget process, we think the next major France-related catalyst for the EUR is more likely to be the presidential election, potentially in Q1 2027 as the candidate field becomes clearer.
- id: E004
  text: We assume downside risks to the EUR continue to dominate over the medium term but expect them to become more relevant for markets once there is greater clarity on the presidential field.
- id: E005
  text: As such, France may prove more of a 2027 story than a late-2026 story for the EUR.
- id: E006
  text: 'While our economists are not particularly constructive on the macro side, and our rates strategists remain concerned about fiscal slippage and the Moody’s Oct 23rd rating decision, our main medium-term concerns for the EUR reflect: (1) the potential implications of the French Presidential Elections for European integration, and (2) parliamentary fragmentation risks after a potential 2027 snap parliamentary election following the presidential one (see also France cross-asset report 30 Jul ''26).'
- id: E007
  text: In the near term, political stability concerns around the 2027 budget approval process also pose some downside risks to the EUR (Exhibit 1).
- id: E008
  text: However, we work under the assumption that the government manages to present and pass a budget plan with sufficient corrective action to keep the planned deficit unchanged vs 2026, which would likely require c 60bp of measures (see also Euro Area Back to school 1 Sep '26 ).
- id: E009
  text: The next President could dissolve parliament and call for snap elections. In such a scenario, the first round of parliamentary elections would have to follow within 2-4 weeks
- id: E010
  text: We note that France-related risks likely drove some of the sharpest declines in both market- and survey-based measures of EUR sentiment over the past decade (Exhibit 2, Exhibit 3).
- id: E011
  text: To some extent, we think the FX market has already been pricing in France-related risks.
- id: E012
  text: 'For instance, risks around the French presidential election seem already reflected in FX options pricing: forward volatility premia peak around the 6m3m tenor, suggesting investors expect a meaningful pickup in volatility during the April-June 2027 election window. This pattern is particularly evident in the EUR crosses most sensitive to European political risk, including EUR-GBP and EUR-CHF (Exhibit 4, Exhibit 5).'
- id: E013
  text: In fact, z-scores of the forward volatility premium since 2015 suggest that the steepness of the curve in 6m3m space is 2 standard deviations above average for many EUR crosses. To us, this suggests that investors are already paying a historically large premium for volatility around the French election.
- id: E014
  text: Vol aside, our latest sentiment survey shows EUR-USD sentiment remains meaningfully less bullish than before the Iran war – of course, this does not necessarily reflect France- related risks. Yet sentiment remains neutral vs history and does not particularly stand out relative to the periods heading into the 2017 presidential election and the 2024 National Assembly elections. It is also meaningfully lower than ahead of former PM Bayrou’s resignation in 2025 and the 2026 budget negotiations. The same is broadly true for positioning, both in futures and in options (Exhibit 6, Exhibit 7).
- id: E015
  text: That said, the stakes may be higher for the EUR this time, based on the limited polling available so far, which points to a potentially more competitive race than in previous instances.
- id: E016
  text: Looking at other markets also suggests that France-related risks are at least partly priced. In rates, 10y OAT-Bund spreads are near multi-year highs (Exhibit 8). As a rule of thumb, a 10bp widening in the OAT-Bund spread has historically been associated with a roughly 0.4% weaker EUR-USD for sufficiently large shocks (Exhibit 9).
- id: E017
  text: In equities, our European equity strategists are neutral on France, noting the persistent underperformance of French equities relative to European equities since mid-2024, despite their higher cyclicality. This is also consistent with relative France vs. Euro area equity inflows (Exhibit 10, Exhibit 11 and European Equity Strategy 4 Sep '26 ).
- id: E018
  text: 'A simple proxy for France-related risks indeed suggests that they are at least partly priced in: our proxy stands one standard deviation above its post-2015 average, the highest level since the 2017 presidential election (Exhibit 12, Exhibit 13).'
- id: E019
  text: We consider CHF or GBP to be “cleaner” expressions to hedge France- related risks than EUR-USD, which depends more on US policies and data.
