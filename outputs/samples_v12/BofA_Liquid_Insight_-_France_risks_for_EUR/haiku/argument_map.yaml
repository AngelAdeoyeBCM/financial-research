- text: Trading ideas and investment strategies discussed herein may give rise to significant risk and are not suitable for all investors.
  code: NON_CLAIM
  reason: Disclaimer; not an author claim.
- text: Investors should consider this report as only a single factor in making their investment decision.
  code: NON_CLAIM
  reason: Disclaimer boilerplate.
- text: 'We construct four components: 1) risk reversals, 2) MSCI France/MSCI Europe ratio, 3) 10y OAT-Bund spreads, and 4) FX positioning.'
  code: META
  reason: Describes proxy methodology; the proxy result is cited as evidence.
- text: Our approach is inspired by Lina Fransson and Oskar Tysklind (2017), An index for financial conditions in Sweden, Sveriges Riksbank Economic Review 2017:1.
  code: META
  reason: Methodology citation; not an argument.
- text: 'Chart of the day: France-related risks seem partly priced '
  code: REDUNDANT
  reason: Restates the proxy finding already captured in the evidence.
- text: That said, the French Real Effective Rate is at its lowest level since at least 2015, reflecting relatively subdued French inflation (on Bank for International Settlements’ measure).
  code: NOT_LOAD_BEARING
  reason: Data description not used to support any argument's conclusion.
