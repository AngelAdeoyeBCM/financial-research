arguments:
- id: A001
  summary: 'French fiscal and political risks look reasonably, at least partly, priced in FX [S001]. Three things support this: FX options already price the election [A002], EUR-USD sentiment is neutral [S021] and positioning does not stand out [S022]. Other markets also look partly priced [A003]. The link rests on France risk having driven past falls in EUR sentiment [S014]. Two qualifications apply: the drop in sentiment since the Iran war may not be about France [S020], and the low French REER reflects subdued inflation [S015]. The risk is that the stakes may be higher this time [A004].'
  conclusion: S001
