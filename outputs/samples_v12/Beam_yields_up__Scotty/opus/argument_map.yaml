exclusions:
- text: This week we take a look at the implications for FX markets, in particular the US dollar.
  code: META
  reason: Describes the note's scope.
- text: The broad conclusion?
  code: META
  reason: Rhetorical lead-in.
- text: Does that answer the question?
  code: META
  reason: Rhetorical aside.
- text: Nothing really to see here.
  code: REDUNDANT
  reason: Repeats the drift-not-stress view (S009).
- text: Except, now there is.
  code: REDUNDANT
  reason: Repeats the market-focus claim (S001).
- text: How is your $16bn looking now Scott?
  code: REDUNDANT
  reason: Rhetorical question; the point is captured in S012 and S014.
- text: So what does all of this mean for FX markets?
  code: META
  reason: Section transition.
- text: When it comes to the short- end, the 2-yr yield correlation is a still healthy 50%, but now all eyes will switch to this week’s Jackson Hole symposium and Kevin Warsh’s keynote address on Friday.
  code: NON_CLAIM
  reason: Data and event scheduling.
- text: Luckily for Chair Warsh, there is no Q&A following his speech.
  code: TANGENTIAL
  reason: Aside about the speech format.
- text: The key questions remain if this will be followed by more JPY buying and, will the BoJ back up the moves with rate hikes?
