# Judgement calls for adjudication review.
adjudication_notes:
- S001 supports S007 because the source answers the stretched signals directly ("Is this enough to call for a reversal? We do not think so").
- The valuation model yields three claims - USD overvalued versus G10 (S002, merging E007 and E008), USD at fair value against GBP (S003) and EUR, SEK and NZD cheap (S004).
- S014 (oil) supports S001 as a driver of the rally the core describes.
- Dropped clauses inside represented sentences, each failing the pruning tests - "However, markets have long priced..." (E017), "while an October move still looks unlikely" (E023), "even if we expect some stabilisation today" (E024), "too hawkish for 2027 (100bp by July)" (E028).
- S018 (non-baseline risk-premium expansion) qualifies the EUR/USD forecast; S019 qualifies S018 by capping the spread.
- S021 carries its same-sentence ground ("December hike fully priced") in its wording rather than as a separate OBSERVATION.
- S028 (GBP strength) is its own argument, licensed by "underpinning"; the budget risk attaches to it, not to the EUR/GBP range.
- S029 carries its same-sentence ground ("little fiscal concern priced") in its wording.
- '"Continued pressure on emerging markets today" (E036) is a vague relay and is not represented; S036 grounds S037 directly within the same sentence.'
- S032 is the analyst's own nowcast, typed FORECAST; DATA_POINT is reserved for reported or attributed statistics.
