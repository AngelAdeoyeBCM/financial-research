# Judgement calls for adjudication review.
adjudication_notes:
- '"These points" in E005 is read as the defensive sentiment (S001) plus FOMO (S007).'
- S009 is typed RECOMMENDATION although it is phrased as the focus of sales conversations.
- S010 is an implicit house trade idea; S011 is a scenario held by global investors (attribution not yet modelled), typed VIEW because it names no measurable outcome.
- Client traction for the short basket (E007) is commercial colour and is not represented.
- The AI-positioning item has only its own observation as support, so it is not an argument and is excluded.
- The retail-activity item reports a third-party finding without a conclusion, so it is excluded.
- S002 is an OBSERVATION kept because A001 needs it; diagrams hide it by default.
- S004, S005, S012 and S014 are reported quantitative facts, typed DATA_POINT.
