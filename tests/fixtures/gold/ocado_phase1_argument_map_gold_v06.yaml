# Phase 1 GOLD argument map — Ocado Smart Carry (hand-adjudicated)
# Aim: the author's core arguments, each the sufficient set of components that keeps its reasoning coherent.
# claim_type: RECOMMENDATION | VALUATION | FORECAST | VIEW | DATA_POINT | OBSERVATION
#   Type test order: advises an action -> RECOMMENDATION; worth vs price -> VALUATION;
#   identifiable future outcome or the author's own estimate -> FORECAST;
#   reported fact with a substantive number -> DATA_POINT; reported fact without one -> OBSERVATION;
#   explicit judgement, interpretation or causal attribution -> VIEW; anything else is excluded.
# modality:   SPECULATIVE < HEDGED < ASSERTED (DATA_POINT and OBSERVATION are always ASSERTED)
# modality_cue: required; verbatim phrase from the statement's evidence.
# Roles:
#   core_claim, supporting, risks, conditions, catalysts, qualifiers -> RECOMMENDATION | VALUATION | FORECAST | VIEW
#   rationale                                                        -> DATA_POINT | OBSERVATION
#   qualifiers: explicitly restricts the scope, applicability, magnitude or duration of the core, incl. exceptions.
# Every argument needs at least one relation other than an OBSERVATION in rationale.
# OBSERVATIONs are kept only where an argument needs them; diagrams hide them by default.
# Evidence is full verbatim sentences; one sentence may ground several statements.
# exclusions.code: TANGENTIAL | NOT_LOAD_BEARING | REDUNDANT | VAGUE | TRANSIENT | UNFAITHFUL | META | NON_CLAIM
# brief: short display label used by diagrams.
# Summaries cite the statements they rely on, e.g. [S012].

