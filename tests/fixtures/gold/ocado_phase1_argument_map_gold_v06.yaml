evidence:
- id: E001
  text: 'We initiate on the Ocado credit and its outstanding SUNs with an Overweight recommendation.'
- id: E002
  text: 'Credit strength is underpinned by a shift from cash-burning online grocery pureplay to asset-backed retail technology and logistics platform.'
- id: E003
  text: 'Technology Solutions is now the main EBITDA engine, with live-module economics, recurring capacity fees and a growing international footprint supporting our view that the existing module portfolio more than covers the debt stack even before assigning value to future contract wins, SBA trials or ORL.'
- id: E004
  text: 'Whilst strong ytd returns mean that the opportunity is now largely carry-based, it is a compelling one: The 11% coupon means a running yield of almost 10.5% with nearly one year of call protection remaining.'
- id: E005
  text: 'We will discuss the investment case from both sides of the balance sheet centred around our aligned thesis that valuation is unchallenged given the present value of current modules leaving further contract wins and opportunities within SBA and ISF as free options.'
- id: E006
  text: 'Founded in 2000 as a pure-play online supermarket in the UK, Ocado is now more accurately described as a technology solutions partner for an international network of grocery retailers.'
- id: E007
  text: 'Existing active modules imply almost £2.8bn of EV at £24m per module, driving an estimated 24% LTV after £765m of cash against the £1.8bn debt stack.'
- id: E008
  text: 'Additional contract signings - more likely now we expect given exclusivity has rolled off in key markets such as the US - and the potential for a contract win or even an announcement of a trial of Ocado’s store-based automation (SBA) system, both serve as free options, further supporting our estimate of asset coverage.'
- id: E009
  text: 'The prospect of balance sheet rehabilitation is credible in our view as cost savings, stronger Solutions EBITDA and lower capex offset the historic bear case around structural cash burn.'
- id: E010
  text: 'Management’s guidance for positive cash flow in 4Q26 and FY27 depends most on capex discipline, with our model assuming no uncommitted CFC expansion.'
- id: E011
  text: 'Liquidity is ample, including £765m of cash and a £300m undrawn RCF, allowing repayment of the £350m January 2027 convert and potentially further debt reduction through the 10% 103 soft call on the 2030 notes.'
- id: E012
  text: 'We expect net leverage, on a ratio basis, to decline to 3.9x at FY26 from 4.9x at 1H26 and to 2.3x by FY28.'
- id: E013
  text: 'We expect stronger underlying EBITDA, driven by recurring fee income and cost savings at Tech Solutions and lower Group-level capex to deliver a very modest positive (+£2.6m) cash flow in FY27, in line with management guidance.'
- id: E014
  text: 'Risks to our recommendation include uneven international adoption, the cash drag from major new CFC wins, a porous covenant package, and new debt incurrence'

