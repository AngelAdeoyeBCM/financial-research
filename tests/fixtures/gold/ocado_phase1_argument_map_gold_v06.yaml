exclusions:
- {text: 'We will be hosting a webinar later today, 08 February at 1400 UKT, with Marcus Diebel who covers Ocado within our European Equity Research team and also holds an Overweight recommendation.', code: META, reason: 'Event logistics; equity rating is context, not argued.'}
- {text: 'We will also offer an opportunity for Q&A.', code: NON_CLAIM, reason: Non-claim.}
- {text: 'Please register here.', code: NON_CLAIM, reason: Non-claim.}
- {text: 'Ocado has long framed high cash burn as a positive, being that it signifies strong demand for its capex-intensive Solutions business.', code: TANGENTIAL, reason: Historical background; not essential to any argument.}
- {text: 'The corollary, of course, is a consistent need for fresh capital.', code: TANGENTIAL, reason: Historical background; not essential to any argument.}
- {text: 'Ocado now generates profit through two distinct but complimentary businesses: Technology Solutions, which offers vertically integrated software and physical retail solutions, predominantly via the Ocado Smart Platform (OSP) and Ocado Logistics, which provides fulfilment services to Ocado’s UK clients, including Ocado Retail Limited (ORL).', code: NOT_LOAD_BEARING, reason: Describes the business mix; adds nothing S002 needs.}
- {text: 'The heritage online supermarket is outside the Restricted Group and bondholders have no claim on Ocado’s 50% stake, but it remains a key proof point for the OSP model and a potential source of shareholder-loan recovery.', code: TANGENTIAL, reason: ORL is never argued for or against any thesis.}
- {text: 'In this note we expand on the above the points, present summary models including at the consolidated Group-level but also for Tech Solutions, Ocado Logistics and ORL as well as offering deep dives into all three divisions.', code: META, reason: Meta-text.}
- {text: 'We also outline our expectations for cash flow, including the crucial variable of capex, over the next three years.', code: META, reason: Meta-text.}
- {text: 'However, as new orders have dried up and existing clients (Kroger, Sobey’s) have closed existing CFCs or cancelled planned openings, cash flow has been inadvertently supported by significantly lower CFC capex.', code: UNFAITHFUL, reason: 'A caveat on the quality of past cash flow, not a reason for the FY27 forecast.'}

# Judgement calls for adjudication review.
adjudication_notes:
- S002 absorbs E006 ("now more accurately described as a technology solutions partner") as extra evidence because it restates the same shift; the former A002 is now a component of A001.
- Liquidity (former A009) is internal to A005; S016 supports rehabilitation and S015 grounds it.
- S004 merges E003 (credit view) and E005 (aligned equity/credit thesis) as one proposition; it stays VIEW, borderline VALUATION.
- S005 keeps its concession ("now largely carry-based") because it defines the opportunity.
- S008 (LTV) is typed VALUATION because it is derived from the S007 enterprise-value estimate.
- S009 absorbs its stated reason (exclusivity rolled off) instead of a separate OBSERVATION, since the reason serves a catalyst rather than a core.
- S014 restates the model assumption as a FORECAST so it can serve as a condition.
- S006 and S015 are reported quantitative facts, typed DATA_POINT.
- S003 is an OBSERVATION kept because A002 needs it; diagrams hide it by default.
- S010 keeps the source ambiguity on whether the "contract win" is SBA-specific.
