# Geographies. IDs: geo:<iso2> for countries, geo:<slug> for regions/blocs/groupings.
# Regions mirror config/taxonomies/classification/market_coverage.yaml.
# Closed set: every country behind an in-scope currency, plus euro-area members
# and countries observed in the corpus.

# -- market groupings ---------------------------------------------------------
- {type: geography, entity_id: geo:global, name: Global, level: market_grouping, aliases: [world, global economy]}
- {type: geography, entity_id: geo:dm, name: Developed Markets, level: market_grouping, aliases: [DM, developed markets]}
- {type: geography, entity_id: geo:em, name: Emerging Markets, level: market_grouping, aliases: [EM, emerging markets]}
- {type: geography, entity_id: geo:g10, name: G10, level: market_grouping, aliases: [G10 FX, G-10]}

# -- regions ------------------------------------------------------------------
- {type: geography, entity_id: geo:north_america, name: North America, level: region}
- {type: geography, entity_id: geo:europe, name: Europe, level: region}
- {type: geography, entity_id: geo:asia, name: Asia, level: region, aliases: [Asia Pacific, APAC, EM Asia, Asia ex-Japan]}
- {type: geography, entity_id: geo:australasia, name: Australasia, level: region, aliases: [Antipodes]}
- type: geography
  entity_id: geo:latam
  name: Latin America
  level: region
  aliases: [LatAm]
  relations: {member_of: [geo:em]}
- type: geography
  entity_id: geo:ceemea
  name: CEEMEA
  level: region
  aliases: [Central and Eastern Europe, Middle East and Africa, CEE]
  relations: {member_of: [geo:em]}
- type: geography
  entity_id: geo:middle_east
  name: Middle East
  level: region
  aliases: [Gulf, GCC]
  relations: {member_of: [geo:ceemea]}
- type: geography
  entity_id: geo:africa
  name: Africa
  level: region
  relations: {member_of: [geo:ceemea]}

# -- blocs --------------------------------------------------------------------
- type: geography
  entity_id: geo:ea
  name: Euro Area
  level: bloc
  aliases: [euro area, Eurozone, euro zone, EA, EZ, EMU]
  relations: {member_of: [geo:europe]}
- type: geography
  entity_id: geo:eu
  name: European Union
  code: EU  # ISO 3166-1 exceptionally reserved; QLib's issuer country for EU bonds
  level: bloc
  aliases: [EU]
  relations: {member_of: [geo:europe]}
- {type: geography, entity_id: geo:g7, name: G7, level: bloc, aliases: [G-7]}
- {type: geography, entity_id: geo:g20, name: G20, level: bloc, aliases: [G-20]}

# -- countries: North America -------------------------------------------------
- {type: geography, entity_id: geo:us, name: United States, code: US, level: country, aliases: [USA, U.S., America], relations: {member_of: [geo:north_america]}}
- {type: geography, entity_id: geo:ca, name: Canada, code: CA, level: country, relations: {member_of: [geo:north_america]}}

