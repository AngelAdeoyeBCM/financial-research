# Rates markets. Only underlyings: a rate index stands for its fixing and
# the swap/OIS curve priced off it; a bond is one obligor's curve, either
# sovereign_bond (obligor: the country/bloc) or non_sovereign_bond (an organization). Tenors (10y, 2y2y), forms (swap, futures,
# swaption) and structures (2s10s, OAT-Bund) are built per mention.
# IDs: rate:<slug>, bond:<slug>. Closed set: >=1 of each per in-scope currency.
#
# QLib: a rate index is idx[<currency code>,<ref_code>]; a bond curve is
# bndcnv[<country>,<bond class>,<currency code>], derived from its fields.
# ref_code is QLib's code within the currency, not always the market name
# (CORRA -> OIS, FR007 -> REPO). No ref_code: QLib has no index for it, or the
# match is unconfirmed (marked "check").

