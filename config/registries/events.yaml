# Events. IDs: event:<slug>. Recurring series (recurrence set) and named
# one-offs (dates set). A dated occurrence ("FOMC Sep-26") is the series plus
# a mention-level date. Data releases are indicators, not events.
# Closed set: one policy_meeting per central bank (HKMA excepted: currency board).

