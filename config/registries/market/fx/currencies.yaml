# Currencies: key = ISO 4217 code -> ccy:<CODE>. Generated 2026-11-10 from the old registry plus currencies seen
# >= 1 times in ledger_asset_ticker; hand-maintained from here.
#   issuer_id         issuing central bank: the QLib CentralBankCode, then the old registry's issuer_id as
#                     written there (org:fed; config/registries/currencies.yaml, merged in 2026-11-11)
#   default_ois_id    the index "<CCY> OIS" means; default_ibor_id the index "<CCY> IBOR swaps" means. A bare
#                     "<CCY> swap" takes the IBOR default where there is one, else the OIS default.
#   non_deliverable   forwards settle as NDFs (QLib NonDeliverable)
#   onshore_id        the onshore currency of an offshore one (QLib OnShoreCcyCode: CNH -> CNY)
#   anchor_code         the currency it is pegged to or follows (hand-curated; QLib's meeting currency is a
#                     USD placeholder for every currency without its own meetings)
# References hold bare keys (PBOC, CNY, CNH.HIBOR); the loader adds the org:/ccy:/idx: prefix.

