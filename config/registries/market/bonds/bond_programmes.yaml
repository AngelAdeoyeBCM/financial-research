# Bond programmes: one issuer's bonds in one currency and coupon type. Key derived obligor + currency +
# coupon -> bnd:us_treasury.USD.nominal. obligor_id is an issuer organization (config/registries/
# organization): a sovereign issuer, sub-sovereign, agency or supranational; whether a programme is
# sovereign, and its country, come from the issuer. coupon: nominal (default) | linker | floater.
# EGBs and dim sum bonds are left out: many issuers. Hand-maintained.

