# Policy rates: set by the currency's central bank, not swapped. Key derived currency + code -> idx:USD.FDTR,
# the same idx prefix as the market indices (QLib idx[USD,FDTR]). Overnight (is_ois true by default, as QLib's
# IsOis). A bank's headline rate is its policy_rate_id (organization/central_banks.yaml). Split out of
# rate_indices.yaml 2026-11-11.
#   corridor   floor | ceiling: the edge of the corridor the rate sets for overnight market rates
#   is_range   the target is a range, not a point (Fed funds target, 3.75-4.00%)

- {currency_id: USD, code: FDTR, name: Fed funds target, is_range: true}
- {currency_id: USD, code: IORB, name: IORB}
- {currency_id: USD, code: ONRRP, name: ON RRP rate, corridor: floor}
- {currency_id: EUR, code: DFR, name: ECB deposit facility rate, corridor: floor}
- {currency_id: EUR, code: MRO, name: ECB main refinancing rate}
- {currency_id: EUR, code: MLF, name: ECB marginal lending rate, corridor: ceiling}
- {currency_id: GBP, code: BANKRATE, name: Bank Rate}
- {currency_id: JPY, code: BOJRATE, name: BoJ policy rate}
- {currency_id: CHF, code: SNBRATE, name: SNB policy rate}
- {currency_id: CAD, code: BOCR, name: BoC overnight rate target}
