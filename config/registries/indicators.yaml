# Indicators: measure x geography (geography_id) x basket [x source].
# IDs: ind:<iso2|ea|global>:<slug>. basket defaults to headline; source is set
# only for non-official providers (ADP, ISM). Kind comes from the measure.
# Data releases are indicators (US CPI), not events. Transforms (YoY, SA,
# 3m annualised) and reference periods (Sep, Q2) are mention-level.

# -- United States ------------------------------------------------------------
- {type: indicator, entity_id: ind:us:cpi, name: US CPI, measure_id: meas:cpi, frequency: monthly, aliases: [US consumer prices, US headline CPI], geography_id: geo:us, relations: {published_by: [org:bls]}}
