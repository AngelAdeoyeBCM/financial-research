# Policy tools: levers an authority (authority_id) sets. IDs: policy:<slug>.
# The tool's setting or status (expanded, cut, ended) is a state, not part of
# the entity. Policy rates are indicators; the meetings and budgets that
# decide tools are events. Bare "QT" stays unresolved: the authority is needed.

# == monetary =================================================================
# -- ECB --
- {type: policy, entity_id: policy:ecb_app, name: APP, kind: asset_purchase, aliases: [Asset Purchase Programme, ECB APP], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_pepp, name: PEPP, kind: asset_purchase, aliases: [Pandemic Emergency Purchase Programme], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_tpi, name: TPI, kind: backstop, aliases: [Transmission Protection Instrument, ECB TPI], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_omt, name: OMT, kind: backstop, aliases: [Outright Monetary Transactions], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_ltro, name: LTRO, kind: lending_facility, aliases: [LTROs, 3Y LTRO, TLTRO, TLTROs, targeted LTRO], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_qt, name: ECB QT, kind: balance_sheet_runoff, aliases: [ECB balance sheet runoff, ECB quantitative tightening], authority_id: org:ecb}
- {type: policy, entity_id: policy:ecb_structural_operations, name: ECB structural operations, kind: liquidity_operation, aliases: [structural portfolio, structural tender, structural refinancing operations], authority_id: org:ecb}
