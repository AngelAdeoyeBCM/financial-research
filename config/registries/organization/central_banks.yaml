# Central banks: key -> org:<KEY>. One per currency in market/fx/currencies.yaml, plus Eurosystem national banks.
# Rewritten 2026-11-11; hand-maintained.
#   key                CB.<ISO 3166 alpha-2> of the jurisdiction (CB.US); the ECB is CB.EZ, ISO's code reserved
#                      for the eurozone. A currency names its bank (Currency.central_bank_id). QLib's
#                      CentralBankCode (FED, CBB, ...) is mapped in market/external/qlib.py.
#   name               official name, as the bank styles itself
#   short_name         the name markets use
#   jurisdiction_id    the country (cntry:US) or group (geo:euro_area) its policy covers
#   system_id          the system a national bank belongs to (CB.DE -> CB.EZ)
#   policy_rate_id     the headline policy rate (market/rates/policy_rates.yaml)
#   inflation_target   point target, % y/y;  inflation_band: [low, high], tolerance or target range
#   inflation_measure  cpi | cpif | hicp | pce
# Mandates as of 2026-11; `# verify` marks values to confirm against the bank. Pegged and unanchored
# regimes have none. Meeting dates are in dates/central_bank_meetings.yaml.

# -- G10 -----------------------------------------------------------------------------------------------------------
CB.US: {name: Federal Reserve System, short_name: Fed, jurisdiction_id: "cntry:US", policy_rate_id: USD.FDTR, inflation_target: 2.0, inflation_measure: pce}
CB.EZ: {name: European Central Bank, short_name: ECB, jurisdiction_id: "geo:euro_area", policy_rate_id: EUR.DFR, inflation_target: 2.0, inflation_measure: hicp}
CB.GB: {name: Bank of England, short_name: BoE, jurisdiction_id: "cntry:GB", policy_rate_id: GBP.BANKRATE, inflation_target: 2.0, inflation_measure: cpi}
