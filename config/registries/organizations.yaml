# Organizations. IDs: org:<slug>. `kinds` is multi-valued (see OrgKind).
# Closed set: one central bank per in-scope currency. Others: observed in corpus.
# Committees (FOMC, MPC, Copom) alias their central bank; a dated meeting is an event.

# -- central banks (closed set) -----------------------------------------------
- type: organization
  entity_id: org:fed
  name: Fed
  kinds: [central_bank, regulator]
  aliases: [Federal Reserve, US Federal Reserve, Federal Reserve System, Federal Reserve Board, Federal Open Market Committee, FOMC]
  geography_id: geo:us
- type: organization
  entity_id: org:ecb
  name: ECB
  kinds: [central_bank, regulator]
  aliases: [European Central Bank, ECB Governing Council, Eurosystem]
  geography_id: geo:ea
- type: organization
  entity_id: org:boe
  name: BoE
  kinds: [central_bank, regulator]
  aliases: [Bank of England, BOE, MPC, BoE MPC, Monetary Policy Committee]
  geography_id: geo:gb
