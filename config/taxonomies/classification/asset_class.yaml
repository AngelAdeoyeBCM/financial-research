# Asset-class labels for financial research.
# Keys are classifier labels and enum values; asset_class_id is the stable ID.
# Descriptions must be passed explicitly to GLiNER2.
# Status, version, and classification settings are handled by the application.
#
# Length budget: GLiNER2 encodes the prompt, every description and every example
# alongside each text chunk. Keep descriptions to ~20 words, examples to <=4.
# Example labels are keys; SchemaBuilder maps them to display names.

version: "1"

id: asset_class
type: classification

multi_label: true
threshold: 0.9

name: Asset class
prompt: >-
  Asset classes the research mainly analyses or recommends trades in.

labels:
  equities:
    name: Equities
    description: >-
      Stocks, equity indices, sectors, equity derivatives, earnings and
      stock recommendations.
    status: active

  rates:
    name: Rates
    description: >-
      Government-bond yields, curves, duration, swaps, rates futures and
      options, and policy-rate pricing.
    status: active

  credit:
    name: Credit
    description: >-
      Credit spreads, CDS, corporate bonds, investment-grade and
      high-yield debt, default risk.
    status: active

  fx:
    name: FX
    description: >-
      Currencies, exchange rates, FX spot, forwards and options, and
      currency forecasts or trades.
    status: active

  commodities:
    name: Commodities
    description: >-
      Oil, gas, power, metals and agricultural markets: prices, inventories,
      supply and demand.
    status: active

# Few-shot examples lowered precision for this task in testing; descriptions alone scored better.
examples: []
