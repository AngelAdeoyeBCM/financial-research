version: "1"

id: entity_type
type: extraction

threshold: 0.8

labels:
  publisher:
    name: Publisher
    description: >-
      The research firm that wrote and distributes the document, such as
      HSBC, UBS or J.P. Morgan. Not data vendors or news agencies.
    threshold: null
    status: active

  author:
    name: Author
    description: >-
      Full name of an analyst or economist credited with writing
      the research.
    threshold: null
    status: active

  country:
    name: Country
    description: >-
      A named sovereign state or nation.
    threshold: null
    status: active

