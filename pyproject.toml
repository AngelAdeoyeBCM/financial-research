[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "gliner2[local,train]>=2.1.0",
    "mermaid-py>=0.9.0",
    "pip-system-certs>=5.3",
    "pycountry>=26.2.16",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "pysbd>=0.3.4",
    "pyyaml>=6.0",
    "spacy>=3.8.16",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2"]
local = ["ollama>=0.4"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyright>=1.1.380",
    "pytest",
    "ruff>=0.13,<0.14",
    "tqdm>=4.66",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = [
    "data",
    "frontend",
    "**/node_modules",
    "research_emails_20260930_14d",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E501 line length)
    "W",    # pycodestyle warnings (W505 doc-line length)
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # simpler comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "D",    # docstrings
    "ANN",  # annotations on function signatures
]
ignore = [
    "D100",    # module docstring
    "D104",    # package docstring
    "D105",    # magic-method docstring
    "D107",    # __init__ docstring (document the class instead)
    "ANN401",  # allow explicit Any where genuinely needed
    "RUF001",  # allow typographic characters in strings (research text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules", "data", "frontend", "research_emails_20260930_14d", "research_chunks", "src/incolor/ingestion"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"

[tool.hatch.build.targets.wheel]
packages = ["src/incolor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
